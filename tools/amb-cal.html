<!doctype html>
<meta charset="utf-8">
<title>Ambience levels</title>
<!-- Measures every place, weather and wind step (0 to 1 by 0.1) of the ambience, the same way sound.js would on first use,
     and prints the CAL table to paste into sound.js. Serve the repo root and open /tools/amb-cal.html; no sound plays. -->
<pre id="out">Measuring</pre>
<script src="../sound.js"></script>
<script>
(async () => {
  const out = document.getElementById('out'), A = AmbSound, CAL = {}, t0 = performance.now(); let n = 0;
  for (const [p] of A.PLACES) for (const wx of Object.keys(A.WX)) for (let w = 0; w <= 10; w++) {
    const k = A.keyOf(p, wx, w / 10); if (k in CAL) continue;
    CAL[k] = Math.round((await A.measure(p, wx, w / 10)).lufs * 100) / 100; out.textContent = 'Measuring ' + (++n);
  }
  window.CAL_OUT = CAL; out.textContent = JSON.stringify(CAL) + '\n\n' + n + ' keys, ' + Math.round(performance.now() - t0) + ' ms';
})();
</script>
