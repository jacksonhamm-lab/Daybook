    case 'week-mode': S.ui.weekMode = v; FX.enter = 'enter'; save(); return render();
    case 'copy-summary': return copy(summary());
    case 'copy-submit': { const p = periodFor(iso(weekStart)); S.submitted = S.submitted || {}; S.submitted[p.payday] = { at: Date.now(), total: periodHours(p) + estimateHours(p) + extraHours(p) }; save(); return copy(submitSummary(p)); }
    case 'fill-estimates': { const p = periodFor(iso(weekStart)); const pend = pendingDays(p); if (!pend.length) return island.toast('Nothing left to estimate'); return withUndo(`Filled ${pend.length} day${pend.length === 1 ? '' : 's'}`, () => pend.forEach(x => { S.shifts[x.date] = { ...x.est, note: 'estimated' }; })); }
    case 'copy-period': return copy(periodSummary(periodFor(iso(weekStart))));
    case 'goto-period': { weekStart = mondayOf(parse(periodFor(iso(weekStart)).start)); FX.enter = 'enter'; return render(); }
    case 'copy-last': {
      const cur = weekDates(), prev = datesOf(addDays(weekStart, -7));
      if (!prev.some(d => shiftHours(S.shifts[d]))) return island.toast('Last week has no shifts');
      return withUndo('Copied last week’s shifts', () => prev.forEach((d, i) => { if (shiftHours(S.shifts[d])) S.shifts[cur[i]] = { ...S.shifts[d], note: '' }; }));
    }
    case 'jfilter': S.ui.jobFilter = v; FX.seg = true; save(); return render();
    case 'jadd-status': el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); return placeInd(el.parentElement);
    case 'open-job': return openSheet('job', el.dataset.id);
    case 'job-status': { const j = job(); j.status = v; (j.history = j.history || []).push({ s: v, d: today() }); save(); refreshSheet(); return v === 'Offer' && celebrate(`Offer from ${j.company}`, '#30d158'); }
    case 'job-del': { const j = job(); closeSheet(); return withUndo(`${j.company} removed`, () => { S.jobs = S.jobs.filter(x => x !== j); }); }
    case 'followed': { e.stopPropagation(); const j = S.jobs.find(x => x.id === el.dataset.id); j.follow = [...(j.follow || []), today()]; j.nudge = iso(addDays(parse(today()), 7)); commit(); return island.toast(`Follow-up logged · next nudge in a week`, { icon: I.bell, color: '#ff9f0a' }); }
    case 'push-on': return enablePush();
    case 'push-off': return disablePush();
    case 'push-test': {
      if (!SYNC.code) return island.toast('Connect sync first');
      return fetch('api/push/test', { headers: { 'x-sync-key': SYNC.code } })
        .then(r => r.json())
        .then(d => island.toast(d.ok ? 'Test sent — check your notifications' : (d.error || 'Test failed')))
        .catch(() => island.toast('Test failed'));
    }
    case 'toggle-brief': S.settings.remindDaily = !S.settings.remindDaily; commit(); return refreshSheet();
    case 'tm-remind': { const t = task(); t.remind = v || null; save(); return refreshSheet(); }
    case 'rm-done': { const t = S.tasks.find(x => x.id === el.dataset.id); if (t.repeat) { t.doneOn = t.doneOn || {}; t.doneOn[today()] = true; } else t.done = true; commit(); return island.toast('Done', { icon: I.check, color: '#30d158' }); }
    case 'rm-later': { const t = S.tasks.find(x => x.id === el.dataset.id); const n = new Date(Date.now() + 2 * 3600e3); t.remind = pad(n.getHours()) + ':' + pad(n.getMinutes()); commit(); return island.toast('Back at ' + t12(t.remind), { icon: I.bell, color: '#ff9f0a' }); }
    case 'rm-tomorrow': { const t = S.tasks.find(x => x.id === el.dataset.id); t.date = iso(addDays(parse(today()), 1)); if (t.repeat) { t.doneOn = t.doneOn || {}; t.doneOn[today()] = true; } commit(); return island.toast('Moved to tomorrow', { icon: I.arrow, color: '#0a84ff' }); }
    case 'df-cat': DRAFT.cat = v; return composeStep(1);
    case 'df-when': DRAFT.date = v; return composeStep(2);
    case 'df-remind': DRAFT.remind = v || null; return addDraft();
    case 'df-skip': return composeStep((DRAFT.step || 0) + 1);
    case 'df-back': return composeStep((DRAFT.step || 0) - 1, 'back');
    case 'df-add': return addDraft();
    case 'sync-on': { const v = $('#syncCode').value.trim(); if (v.length < 16) return island.toast('That code looks too short'); setSyncCode(v); return refreshSheet(); }
    case 'sync-off': setSyncCode(''); return refreshSheet();
    case 'sync-now': return syncNow();
    case 'settings': return openSheet('settings');
    case 'export': { const blob = new Blob([JSON.stringify({ daybook: S, workout: { state: readLS(W_STATE, {}), cardio: cardioLogs(), pushups: benchLogs('pushups'), plank: benchLogs('plank'), row: benchLogs('row') } }, null, 2)], { type: 'application/json' }); const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = `daybook-backup-${today()}.json`; a2.click(); return URL.revokeObjectURL(a2.href); }
    case 'import': return $('#importFile').click();
    case 'close-sheet': return closeSheet();
    case 'close-all': closeSpot(); return closeSheet();
    case 'spot-open': return openSpot();
    case 'spot-ex': $('#spotInput').value = el.textContent; spotPreview(); return $('#spotInput').focus();
  }
});

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'spotForm') {
    const v = $('#spotInput').value; if (!v.trim()) return closeSpot();
    const r = parseQuick(v);
    if (r && r.kind === 'task' && !r.dateSet && !r.tagged && !r.repeat) { closeSpot(); return openCompose(r.title); }
    if (applyQuick(r)) { $('#spotInput').value = ''; spotPreview(); const p = $('#spotPrev'); p.classList.remove('spot-flash'); void p.offsetWidth; p.classList.add('spot-flash'); }
    return;
  }
  if (f.classList.contains('qadd')) {
    const inp = f.querySelector('input'), v = inp.value; if (!v.trim()) return;
    const base = f.dataset.date || null, r = parseQuick(v, base);
    if (applyQuick(r)) { const key = f.dataset.date; requestAnimationFrame(() => { const nf = $$(`#v-${S.ui.tab} form.qadd`).find(x => x.dataset.date === key); nf && nf.querySelector('input').focus(); }); }
    return;
  }
  if (f.id === 'jadd') {
    const company = f.company.value.trim(); if (!company) return f.company.focus();
    const status = f.querySelector('[data-act="jadd-status"].on').dataset.v;
    S.jobs.push({ id: uid(), created: Date.now(), company, role: f.role.value.trim(), link: f.link.value.trim(), status, date: today(), notes: '' });
    haptic(); commit(); island.toast(`${company} · ${status}`, { icon: I.jobs, color: '#30d158' });
    const nf = $('#jadd'); nf && nf.link.focus(); return;
  }
  if (f.dataset.bench) {
    const k = f.dataset.bench, v = parseInt(f.querySelector('input').value); if (!v) return;
    const L = benchLogs(k), prevBest = L.length ? Math.max(...L.map(x => x.reps)) : 0, n = new Date();
    L.push({ reps: v, week: `Wk ${L.length + 1} · ${MON[n.getMonth()]} ${n.getDate()}` }); writeLS(W_LOGS[k], L);
    render(); return v > prevBest && prevBest ? celebrate(`New PR · ${v}`, '#ff9f0a') : island.toast('Benchmark logged', { icon: I.check, color: '#ff9f0a' });
  }
  if (f.classList.contains('cardio-f')) return logCardio(f);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'spotInput') return spotPreview();
  if (el.name === 'link' && el.form && el.form.id === 'jadd' && !el.form.company.value.trim()) { const c = companyFromUrl(el.value.trim()); if (c) { el.form.company.value = c; pop(el.form.company); } }
  if (el.dataset.df) {
    DRAFT[el.dataset.df] = el.value || (el.dataset.df === 'remind' ? null : DRAFT[el.dataset.df]);
    if (el.dataset.df === 'date') return composeStep(2);
    if (el.dataset.df === 'remind') return addDraft();
    return;
  }
  if (el.dataset.tf === 'title') { const t = S.tasks.find(x => x.id === SHEET.arg.id); t.title = el.value.replace(/\n/g, ' '); return save(); }
  if (el.dataset.jf) { const j = S.jobs.find(x => x.id === SHEET.arg); j[el.dataset.jf] = el.value; return save(); }
  if (el.dataset.sf) { if (el.dataset.sf === 'rate') S.settings.rateSet = true; const n = ['rate', 'hoursGoal', 'appGoal', 'payCycle', 'extraHours', 'payCutoff', 'paySubmitDays'].includes(el.dataset.sf); S.settings[el.dataset.sf] = n ? (+el.value || 0) : el.value; return save(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f) {
    const d = el.dataset.date || el.closest('[data-date]').dataset.date, s = S.shifts[d] || (S.shifts[d] = {});
    s[el.dataset.f] = el.dataset.f === 'brk' ? (el.value === '' ? '' : Math.max(0, +el.value)) : el.value;
    if (!s.start && !s.end && !s.note && !s.brk) delete S.shifts[d];
    save(); return updateShiftDisplays(d);
  }
  if (el.dataset.tf === 'remind') { const t = S.tasks.find(x => x.id === SHEET.arg.id); t.remind = el.value || null; save(); return refreshSheet(); }
  if (el.dataset.tf === 'date') { const t = S.tasks.find(x => x.id === SHEET.arg.id); t.date = el.value || null; if (t.repeat && t.repeat.t === 'weekly' && t.date) t.repeat.dow = dowIdx(t.date); save(); return refreshSheet(); }
  if (el.dataset.extra) { setExtra({ end: el.dataset.extra }, el.value); return render(); }
  if (el.dataset.act === 'set-tpl') { S.template[+el.dataset.i] = el.value; commit(); return island.toast(`${DOW[+el.dataset.i]} → ${el.value === 'REST' ? 'Rest' : el.value}`, { icon: I.training, color: '#ff9f0a' }); }
});
// Shift edits don't re-render (keeps focus); refresh everything once focus leaves the editor.
document.addEventListener('focusout', e => {
  if (!e.target.dataset || !e.target.dataset.f) return;
  setTimeout(() => { const a = document.activeElement; if (!(a && a.dataset && a.dataset.f) && !SHEET) render(); }, 60);
});

$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text()), db = data.daybook || data;
    if (!db || !Array.isArray(db.tasks)) throw 0;
    if (!confirm('Replace everything in Daybook with this backup?')) return;
    localStorage.setItem(KEY, JSON.stringify(db));
    if (data.workout) { writeLS(W_CARDIO, data.workout.cardio || []); ['pushups', 'plank', 'row'].forEach(k => data.workout[k] && writeLS(W_LOGS[k], data.workout[k])); }
    S = load(); closeSheet(); render(); island.toast('Backup restored', { icon: I.check, color: '#30d158' });
  } catch (err) { island.toast('That isn’t a Daybook backup'); }
  e.target.value = '';
});

/* drag & drop (desktop) */
let dragId = null;
document.addEventListener('dragstart', e => { const li = e.target.closest && e.target.closest('.task[draggable=true]'); if (!li) return; dragId = li.dataset.id; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
document.addEventListener('dragend', () => { dragId = null; $$('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')); });
document.addEventListener('dragover', e => { if (!dragId) return; const z = e.target.closest('.drop'); if (!z) return; e.preventDefault(); $$('.over').forEach(x => x !== z && x.classList.remove('over')); z.classList.add('over'); });
document.addEventListener('drop', e => {
  if (!dragId) return; const z = e.target.closest('.drop'); if (!z) return; e.preventDefault();
  const t = S.tasks.find(x => x.id === dragId); if (!t) return;
  if (!z.dataset.drop) return;
  t.date = z.dataset.drop; FX.added = t.id; haptic(); commit();
  island.toast(`Moved to ${rel(t.date)}`, { icon: I.arrow, color: CATS[t.cat].color });
});

/* drag-to-dismiss sheets (touch). Swipe-to-change-week was removed: diagonal scrolls kept flipping weeks. */
let sd = null;
$('#sheet').addEventListener('pointerdown', e => { if (!e.target.closest('.grab,.sart .art') || e.target.closest('button') || e.pointerType === 'mouse') return; sd = { y: e.clientY, dy: 0 }; $('#sheet').classList.add('dragging'); });
addEventListener('pointermove', e => { if (!sd) return; sd.dy = Math.max(0, e.clientY - sd.y); $('#sheet').style.transform = `translate(-50%,${sd.dy}px)`; });
addEventListener('pointerup', () => { if (!sd) return; const sh = $('#sheet'); sh.classList.remove('dragging'); sh.style.transform = ''; if (sd.dy > 110) closeSheet(); sd = null; });

/* iOS can still zoom on a fast second tap; swallow it and deliver the tap as a normal click. */
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const t = e.timeStamp;
  if (t - lastTouch < 350 && e.changedTouches.length === 1 && !e.target.closest('input,textarea,select,.grab')) {
    e.preventDefault();
    const hit = e.target.closest('button,a,label,[data-act],[data-tab],summary');
    if (hit) hit.click();
  }
  lastTouch = t;
}, { passive: false });
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));

/* keyboard */
document.addEventListener('keydown', e => {
  const k = e.key;
  if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 'k') { e.preventDefault(); return $('#spot').classList.contains('on') ? closeSpot() : openSpot(); }
  if (k === 'Escape') { if ($('#spot').classList.contains('on')) return closeSpot(); if (SHEET) return closeSheet(); }
  if (e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey || SHEET || $('#spot').classList.contains('on')) return;
  if (k === '/' || k.toLowerCase() === 'n') { e.preventDefault(); return openSpot(); }
  if (k === 'ArrowLeft') return shiftWeek(-1);
  if (k === 'ArrowRight') return shiftWeek(1);
  if (k.toLowerCase() === 't') return shiftWeek(0);
  if ('12345'.includes(k)) return switchTab(TABS[+k - 1].k);
});

/* ---------- live ticking ---------- */
function tick() {
  const el = clockElapsed();
  $$('[data-clock]').forEach(x => x.textContent = fmtDur(el));
  if (REST) {
    const left = Math.max(0, REST.end - Date.now()), secs = Math.ceil(left / 1000);
    $$('[data-rest]').forEach(x => x.textContent = `${Math.floor(secs / 60)}:${pad(secs % 60)}`);
    if (!left) { REST = null; haptic([80, 60, 80]); island.key = null; island.toast('Rest’s up. Next set.', { icon: I.training, color: '#ff9f0a' }); }
  }
}
setInterval(() => { tick(); island.live(); }, 1000);
let lastDay = today();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (today() !== lastDay) { lastDay = today(); weekStart = mondayOf(new Date()); }
  render(); // picks up anything done in the workout app meanwhile
  syncNow();
});
setInterval(() => { if (!document.hidden) syncNow(); }, 60000);
navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'reminder-acted') syncNow(); });
addEventListener('storage', e => { if (e.key && (e.key.startsWith('workout_') || e.key.startsWith('log_'))) render(); });
let lastMode = weekMode();
addEventListener('resize', () => {
  $$('.seg').forEach(s => placeInd(s, true));
  if (weekMode() !== lastMode) { lastMode = weekMode(); if (S.ui.tab === 'week') render(); }
});

/* ---------- boot ---------- */
$('#nav').innerHTML = TABS.map(t => `<button data-tab="${t.k}">${t.label}</button>`).join('');
$('#tabbar').innerHTML = TABS.map(t => `<button data-tab="${t.k}">${I[t.k]}<span>${t.label}</span></button>`).join('');
$('#kbdHint').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘K' : 'Ctrl K';
island.el = $('#island');
FX.enter = 'enter';
render();
loadProgram();
if (SYNC.code) { stashCode(SYNC.code); syncNow(); }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
