    if (applyQuick(r)) { $('#spotInput').value = ''; spotPreview(); const p = $('#spotPrev'); p.classList.remove('spot-flash'); void p.offsetWidth; p.classList.add('spot-flash'); }
    return;
  }
  if (f.classList.contains('qadd')) {
    const inp = f.querySelector('input'), v = inp.value; if (!v.trim()) return;
    const base = f.dataset.date || null, r = parseQuick(v, base);
    if (applyQuick(r)) { const key = f.dataset.date; requestAnimationFrame(() => { const nf = $$(`#v-${S.ui.tab} form.qadd`).find(x => x.dataset.date === key); nf && nf.querySelector('input').focus(); }); }
    return;
  }
  if (f.id === 'jadd') {
    const company = f.company.value.trim(); if (!company) return f.company.focus();
    const status = f.querySelector('[data-act="jadd-status"].on').dataset.v;
    S.jobs.push({ id: uid(), created: Date.now(), company, role: f.role.value.trim(), link: f.link.value.trim(), status, date: today(), notes: '' });
    haptic(); commit(); island.toast(`${company} · ${status}`, { icon: I.jobs, color: '#30d158' });
    const nf = $('#jadd'); nf && nf.link.focus(); return;
  }
  if (f.dataset.bench) {
    const k = f.dataset.bench, v = parseInt(f.querySelector('input').value); if (!v) return;
    const L = benchLogs(k), prevBest = L.length ? Math.max(...L.map(x => x.reps)) : 0, n = new Date();
    L.push({ reps: v, week: `Wk ${L.length + 1} · ${MON[n.getMonth()]} ${n.getDate()}` }); writeLS(W_LOGS[k], L);
    render(); return v > prevBest && prevBest ? celebrate(`New PR · ${v}`, '#ff9f0a') : island.toast('Benchmark logged', { icon: I.check, color: '#ff9f0a' });
  }
  if (f.classList.contains('cardio-f')) return logCardio(f);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'spotInput') return spotPreview();
  if (el.id === 'capText') { NOTE_DRAFT = el.value; el.style.height = 'auto'; el.style.height = Math.min(360, el.scrollHeight + 2) + 'px'; return; }
  if (el.id === 'noteQ') return filterNotes(el.value);
  if (!SHEET && (el.dataset.nf || el.dataset.tf || el.dataset.jf)) return;
  if (el.dataset.nf) { const n = S.notes.find(x => x.id === SHEET.arg); if (!n) return; n.text = el.value; n.edited = Date.now(); const h = $('#sheet h2'); if (h) h.textContent = noteTitle(n); return save(); }
  if (el.name === 'link' && el.form && el.form.id === 'jadd' && !el.form.company.value.trim()) { const c = companyFromUrl(el.value.trim()); if (c) { el.form.company.value = c; pop(el.form.company); } }
  if (el.dataset.df) {
    DRAFT[el.dataset.df] = el.value || (el.dataset.df === 'remind' ? null : DRAFT[el.dataset.df]);
    $$(`#sheet [data-act="df-${el.dataset.df === 'date' ? 'when' : 'remind'}"]`).forEach(b => b.classList.toggle('on', b.dataset.v === el.value));
    return;   // the Next/Add button moves on, so a half-spun picker doesn't
  }
  if (el.dataset.tf === 'title') { const t = S.tasks.find(x => x.id === SHEET.arg.id); t.title = el.value.replace(/\n/g, ' '); return save(); }
  if (el.dataset.jf) { const j = S.jobs.find(x => x.id === SHEET.arg); j[el.dataset.jf] = el.value; return save(); }
  if (el.dataset.sf) { if (el.dataset.sf === 'rate') S.settings.rateSet = true; const n = ['rate', 'hoursGoal', 'appGoal', 'payCycle', 'extraHours', 'payCutoff', 'paySubmitDays'].includes(el.dataset.sf); S.settings[el.dataset.sf] = n ? (+el.value || 0) : el.value; return save(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f) {
    const d = el.dataset.date || el.closest('[data-date]').dataset.date, s = S.shifts[d] || (S.shifts[d] = {});
    s[el.dataset.f] = el.dataset.f === 'brk' ? (el.value === '' ? '' : Math.max(0, +el.value)) : el.value;
    if (!s.start && !s.end && !s.note && !s.brk) delete S.shifts[d];
    save(); return updateShiftDisplays(d);
  }
  if (el.dataset.tf === 'remind') { if (!SHEET) return; const t = S.tasks.find(x => x.id === SHEET.arg.id); t.remind = el.value || null; save(); $$('#sheet [data-act="tm-remind"]').forEach(b => b.classList.toggle('on', b.dataset.v === (t.remind || ''))); return; }
  if (el.dataset.tf === 'date') { if (!SHEET) return; const t = S.tasks.find(x => x.id === SHEET.arg.id); t.date = el.value || null; if (t.repeat && t.repeat.t === 'weekly' && t.date) t.repeat.dow = dowIdx(t.date); save(); return refreshSheet(); }
  if (el.dataset.extra) { setExtra({ payday: el.dataset.extra }, el.value); return render(); }
  if (el.dataset.act === 'set-tpl') { S.template[+el.dataset.i] = el.value; commit(); return island.toast(`${DOW[+el.dataset.i]} → ${el.value === 'REST' ? 'Rest' : el.value}`, { icon: I.training, color: '#ff9f0a' }); }
});
// Shift edits don't re-render (keeps focus); refresh everything once focus leaves the editor.
document.addEventListener('focusout', e => {
  if (!e.target.dataset || !e.target.dataset.f) return;
  setTimeout(() => { const a = document.activeElement; if (!(a && a.dataset && a.dataset.f) && !SHEET) render(); }, 60);
});

$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text()), db = data.daybook || data;
    if (!db || !Array.isArray(db.tasks)) throw 0;
    if (!confirm('Replace everything in Daybook with this backup?')) return;
    localStorage.setItem(KEY, JSON.stringify(db));
    if (data.workout) { if (data.workout.state) writeLS(W_STATE, data.workout.state); writeLS(W_CARDIO, data.workout.cardio || []); ['pushups', 'plank', 'row'].forEach(k => data.workout[k] && writeLS(W_LOGS[k], data.workout[k])); }
    S = load(); closeSheet(); render(); island.toast('Backup restored', { icon: I.check, color: '#30d158' });
  } catch (err) { island.toast('That isn’t a Daybook backup'); }
  e.target.value = '';
});

/* drag & drop (desktop) */
let dragId = null;
document.addEventListener('dragstart', e => { const li = e.target.closest && e.target.closest('.task[draggable=true]'); if (!li) return; dragId = li.dataset.id; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
document.addEventListener('dragend', () => { dragId = null; $$('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')); });
document.addEventListener('dragover', e => { if (!dragId) return; const z = e.target.closest('.drop'); if (!z) return; e.preventDefault(); $$('.over').forEach(x => x !== z && x.classList.remove('over')); z.classList.add('over'); });
document.addEventListener('drop', e => {
  if (!dragId) return; const z = e.target.closest('.drop'); if (!z) return; e.preventDefault();
  const t = S.tasks.find(x => x.id === dragId); if (!t) return;
  if (!z.dataset.drop) return;
  t.date = z.dataset.drop; FX.added = t.id; haptic(); commit();
  island.toast(`Moved to ${rel(t.date)}`, { icon: I.arrow, color: CATS[t.cat].color });
});

/* Drag-to-dismiss sheets (phones). Pull down from the handle any time, or from anywhere
   on the sheet while it's scrolled to the top, the way iOS sheets work. Touch events,
   not pointer events: the browser cancels pointer events the moment it starts a scroll,
   which is what used to leave sheets stuck half-closed. */
let sd = null;
const sheetEl = $('#sheet');
const sheetDraggable = () => innerWidth <= 760;
sheetEl.addEventListener('touchstart', e => {
  sd = null;
  if (!SHEET || !sheetDraggable() || e.touches.length !== 1 || e.target.closest('input,textarea,select')) return;
  const t = e.touches[0];
  sd = { x: t.clientX, y: t.clientY, dy: 0, active: false, grab: !!e.target.closest('.grab,.sart .art'), lastY: t.clientY, lastT: e.timeStamp, v: 0 };
}, { passive: true });
sheetEl.addEventListener('touchmove', e => {
  if (!sd) return;
  const t = e.touches[0], dx = t.clientX - sd.x, dy = t.clientY - sd.y;
  if (!sd.active) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { sd = null; return; } // sideways: chips and rails keep it
    if (dy > 6 && (sd.grab || sheetEl.scrollTop <= 0)) { sd.active = true; sd.y = t.clientY; sheetEl.classList.add('dragging'); }
    else { if (dy < -6 && !sd.grab) sd = null; return; } // pulling up scrolls the sheet as normal
  }
  e.preventDefault();
  sd.dy = Math.max(0, t.clientY - sd.y);
  sheetEl.style.transform = `translate(-50%,${sd.dy}px)`;
  sd.v = (t.clientY - sd.lastY) / Math.max(1, e.timeStamp - sd.lastT); sd.lastY = t.clientY; sd.lastT = e.timeStamp;
}, { passive: false });
const sheetRelease = () => {
  const d = sd; sd = null;
  if (!d || !d.active) return;
  sheetEl.classList.remove('dragging');
  // far enough, or a quick flick, closes it; anything else springs back
  if (d.dy > Math.min(140, sheetEl.offsetHeight * .25) || (d.v > .5 && d.dy > 24)) closeSheet();
  else sheetEl.style.transform = '';
};
sheetEl.addEventListener('touchend', sheetRelease);
sheetEl.addEventListener('touchcancel', sheetRelease);

/* iOS can still zoom on a fast second tap; swallow it and deliver the tap as a normal click.
   Only for taps: a touch that moved (a scroll) must never turn into a click. */
let lastTouch = 0, touchFrom = null;
document.addEventListener('touchstart', e => { const t = e.touches[0]; touchFrom = t ? { x: t.clientX, y: t.clientY } : null; }, { passive: true, capture: true });
document.addEventListener('touchend', e => {
  const now = e.timeStamp, c = e.changedTouches[0];
  const still = !!(touchFrom && c && Math.hypot(c.clientX - touchFrom.x, c.clientY - touchFrom.y) < 10);
  if (still && now - lastTouch < 350 && e.changedTouches.length === 1 && !e.target.closest('input,textarea,select,.grab')) {
    e.preventDefault();
    const hit = e.target.closest('button,a,label,[data-act],[data-tab],summary');
    if (hit) hit.click();
  }
  lastTouch = still ? now : 0;
}, { passive: false });
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));

const isTextField = el => el && el.matches && el.matches('input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=file]),textarea,select');
document.addEventListener('focusin', e => { if (isTextField(e.target)) document.body.classList.add('typing'); });
document.addEventListener('focusout', () => setTimeout(() => { if (!isTextField(document.activeElement)) document.body.classList.remove('typing'); }, 60));

/* keyboard */
document.addEventListener('keydown', e => {
  const k = e.key;
  if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 'k') { e.preventDefault(); return $('#spot').classList.contains('on') ? closeSpot() : openSpot(); }
  if (k === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'capText') { e.preventDefault(); return addNote(); }
  if (k === 'Escape') { if ($('#spot').classList.contains('on')) return closeSpot(); if (SHEET) return closeSheet(); if (S.ui.tab !== 'today') return goHome(); }
  if (e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey || SHEET || $('#spot').classList.contains('on')) return;
  if (k === '/' || k.toLowerCase() === 'n') { e.preventDefault(); return openSpot(); }
  if (k === 'ArrowLeft') return shiftWeek(-1);
  if (k === 'ArrowRight') return shiftWeek(1);
  if (k.toLowerCase() === 't') return shiftWeek(0);
  if (/^[1-9]$/.test(k) && +k <= TABS.length) return switchTab(TABS[+k - 1].k);
});

/* ---------- live ticking ---------- */
function tick() {
  const el = clockElapsed();
  $$('[data-clock]').forEach(x => x.textContent = fmtDur(el));
  if (S.clock && !S.clock.breakTs) $$('[data-disc]').forEach(c => c.style.strokeDashoffset = (DISC_C * (1 - discFrac())).toFixed(1));
  if (REST) {
    const left = Math.max(0, REST.end - Date.now()), secs = Math.ceil(left / 1000);
    $$('[data-rest]').forEach(x => x.textContent = `${Math.floor(secs / 60)}:${pad(secs % 60)}`);
    if (!left) { REST = null; haptic([80, 60, 80]); sfx('chime'); island.key = null; island.toast('Rest’s up. Next set.', { icon: I.training, color: '#ff9f0a' }); }
  }
}
setInterval(() => { tick(); island.live(); }, 1000);
// left open overnight or past a reminder: catch up once a minute (not mid-edit)
let lastSlip = -1;
setInterval(() => {
  if (document.hidden || SHEET) return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  const n = slipped().length, day = today();
  if (day !== lastDay) { lastDay = day; weekStart = mondayOf(new Date()); PAY.date = null; render(); }
  else if (n !== lastSlip && lastSlip !== -1) render();
  lastSlip = n;
}, 60000);
let lastDay = today();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (SYNC.timer) syncNow(0, true); return; }
  haloWake();
  if (today() !== lastDay) { lastDay = today(); weekStart = mondayOf(new Date()); }
  render();
  syncNow();
});
setInterval(() => { if (!document.hidden) syncNow(); }, 60000);
navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'reminder-acted') syncNow(); });
addEventListener('storage', e => { if (e.key && (e.key.startsWith('workout_') || e.key.startsWith('log_'))) render(); });
let lastMode = weekMode();
addEventListener('resize', () => {
  $$('.seg').forEach(s => placeInd(s, true));
  if (weekMode() !== lastMode) { lastMode = weekMode(); if (S.ui.tab === 'week') render(); }
});

/* ---------- boot ---------- */
if (S.ui.tab === 'notes') S.ui.tab = 'week';
if (!TABS.some(t => t.k === S.ui.tab)) S.ui.tab = 'today';
$('#kbdHint').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘K' : 'Ctrl K';
island.el = $('#island');
// A short boot sequence on a cold open; tapping skips it.
(function boot() {
  const el = $('#boot');
  if (!el) return;
  if (REDUCED || sessionStorage.getItem('daybook_booted')) { el.remove(); return; }
  try { sessionStorage.setItem('daybook_booted', '1'); } catch (e) {}
  const { lvl } = levelFor(xpTotal());
  const n = new Date();
  $('#bootLine').textContent = `Level ${lvl} · ${DOW_LONG[(n.getDay() + 6) % 7]}`;
  const end = () => { el.classList.add('gone'); setTimeout(() => el.remove(), 500); };
  el.addEventListener('click', end);
  setTimeout(end, 1500);
})();

FX.enter = 'enter';
migrateProgram();
// the skis he generated became the default on 2026-10-06: move him onto them once (the others are still in Customise)
if (S.settings.skisV !== 1) { if (S.settings.dex && (!S.settings.dex.skis || S.settings.dex.skis === 'bent')) S.settings.dex = { ...S.settings.dex, skis: 'art' }; S.settings.skisV = 1; save(); }
render();
loadProgram();
if (SYNC.code) { stashCode(SYNC.code); syncNow(); }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
