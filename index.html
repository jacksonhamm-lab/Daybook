// per-device flag it kept are cleared, so a link with them still opens cleanly.
(function () {
  try {
    localStorage.removeItem('daybook_home');
    var q = new URLSearchParams(location.search);
    if (q.has('city')) { q.delete('city'); var rest = q.toString(); history.replaceState(history.state, '', location.pathname + (rest ? '?' + rest : '') + location.hash); }
  } catch (e) {}
  window.DAYBOOK_BUILD = 'p22';
  window.DAYBOOK_CITY = true;
  var l = document.createElement('link'); l.rel = 'modulepreload'; l.href = './city.js?v=p22'; document.head.appendChild(l);
  document.documentElement.dataset.city = '';
  var c = document.createElement('style');
  c.textContent = 'html[data-city]{background:#05040a}html[data-city] body{overflow:hidden;overscroll-behavior:none}';
  document.head.appendChild(c);
})();

<script>
/* ============================================================
   Arcadia (the app was Daybook; storage keys still say so) — work hours, tasks, training, school.
   The training program lives here in program.json (five days, D1-D5); it used to be
   read out of the old workout app. Set ticks and benchmark logs are per device (localStorage).
   ============================================================ */
const KEY = 'daybook_v1';
const BUILD = window.DAYBOOK_BUILD;   // set in <head>; shown at the bottom of Settings › Sync, so each device can show which copy it runs
const PROGRAM_V = 2, SPLIT = ['D1', 'D2', 'D3', 'HIIT', 'D4', 'D5', 'REST'];   // program 2: five lifting days, one conditioning, one rest
const CATS = {
  work: { label: 'Work',     color: '#0a84ff' },
  gym:  { label: 'Training', color: '#ff9f0a' },
  jobs: { label: 'Jobs',     color: '#30d158' },
  life: { label: 'Personal', color: '#bf5af2' },
  school: { label: 'School',  color: '#30d158' },
};
const CAT_ORDER = ['work', 'gym', 'jobs', 'life'];
// A category this version doesn't know (a newer version's) never crashes: it borrows
// Personal's colour, and the task lists skip those tasks (knownCat). XP still counts them.
// School work lives on the School page only: never in Today, Plan, overdue, reminders or the badge (planTask).
const knownCat = t => Object.prototype.hasOwnProperty.call(CATS, t.cat);
const planTask = t => knownCat(t) && t.cat !== 'school';
const catOf = k => Object.prototype.hasOwnProperty.call(CATS, k) ? CATS[k] : CATS.life;
const SESS = {
  D1:   { color: '#64d2ff', art: 'linear-gradient(140deg,#062a4a 0%,#0a6fd6 55%,#64d2ff 100%)' },
  D2:   { color: '#30d158', art: 'linear-gradient(140deg,#032b16 0%,#159447 55%,#8ef0b0 100%)' },
  D3:   { color: '#ff9f0a', art: 'linear-gradient(140deg,#3d1402 0%,#e0620a 55%,#ffc46b 100%)' },
  D4:   { color: '#bf5af2', art: 'linear-gradient(140deg,#1e0a36 0%,#7a2fc4 55%,#dba6ff 100%)' },
  D5:   { color: '#ffd60a', art: 'linear-gradient(140deg,#332700 0%,#c79a00 55%,#fff08a 100%)' },
  HIIT: { color: '#ff375f', art: 'linear-gradient(140deg,#3a0414 0%,#e0204a 55%,#ff9fb5 100%)' },
  REST: { color: '#8e8e93', art: 'linear-gradient(140deg,#121217 0%,#26262e 60%,#3a3a44 100%)' },
};
const SESS_KEYS = Object.keys(SESS);
const STATUSES = { Wishlist: '#8e8e93', Applied: '#0a84ff', Interview: '#ff9f0a', Offer: '#30d158', Rejected: '#ff453a' };
const CARDIO_TYPES = ['HIIT', 'Hill', 'Run', 'Range', 'Walk', 'Bike'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOW_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Problem log: the last 40 errors on this device, copyable from Settings so they can be sent over.
window.logProblem = (where, e) => {
  try {
    const msg = e && e.stack ? String(e.stack).split('\n').slice(0, 3).join(' | ') : String(e && e.message || e);
    const log = JSON.parse(localStorage.getItem('daybook_log') || '[]');
    log.push({ t: new Date().toISOString(), w: where, m: msg.slice(0, 400) });
    localStorage.setItem('daybook_log', JSON.stringify(log.slice(-40)));
  } catch (x) {}
  console.warn('[' + where + ']', e);
};
addEventListener('error', e => window.logProblem('page', e.error || e.message));
addEventListener('unhandledrejection', e => window.logProblem('promise', e.reason));

const I = {
  today: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>',
  week: '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  hours: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>',
  training: '<svg class="ico" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',
  jobs: '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3.5"/><path d="M8.5 7V5.5a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2V7M3 12.5h18"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2 8.8-9.4"/></svg>',
  play: '<svg class="ico" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>',
  repeat: '<svg class="ico" viewBox="0 0 24 24"><path d="M17 2.5l3 3-3 3M4 11.5v-1a5 5 0 0 1 5-5h11M7 21.5l-3-3 3-3M20 12.5v1a5 5 0 0 1-5 5H4"/></svg>',
  trophy: '<svg class="ico" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H4.5a3 3 0 0 0 3.5 4M16 6h3.5a3 3 0 0 1-3.5 4M12 13v4M8.5 20.5h7M9.5 17h5"/></svg>',
  link: '<svg class="ico" viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>',
  bell: '<svg class="ico" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16zM10 20.5a2 2 0 0 0 4 0"/></svg>',
  arrow: '<svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  notes: '<svg class="ico" viewBox="0 0 24 24"><path d="M6.5 3.5h8l4 4v13h-12z"/><path d="M14.5 3.5v4h4M9.5 12h6M9.5 15.5h4"/></svg>',
  task: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.8-5"/></svg>',
  school: '<svg class="ico" viewBox="0 0 24 24"><path d="M4 20V9h3V6h2v3h6V6h2v3h3v11zM10 20v-5h4v5"/></svg>',
};

/* ---------- state ---------- */
const defaults = () => ({
  tasks: [], shifts: {}, workouts: {}, jobs: [], clock: null, study: {}, courses: [], studyClock: null, school: null,
  template: SPLIT.slice(),
  extra: {},
  settings: { name: 'Jackson', rate: 20, extraHours: 0, payCutoff: 1, paySubmitDays: 4, remindSubmit: true, nag: 240, dex: {}, hoursGoal: 0, appGoal: 5, payAnchor: '2026-09-25', payCycle: 14 },
  ui: {},
});
function load() {
  for (const k of [KEY, 'planner_v1']) {
    try {
      const raw = JSON.parse(localStorage.getItem(k));
      if (!raw) continue;
      const d = defaults();
      const s = { ...d, ...raw, settings: { ...d.settings, ...raw.settings }, ui: { ...d.ui, ...raw.ui } };
      ['tomb', 'extra', 'shakes', 'meals', 'grocery', 'snacks'].forEach(k => { s[k] = s[k] || {}; });   // older backups lack newer keys
      s.study = s.study || {}; s.courses = s.courses || [];
      s.notes = s.notes || []; s.tasks = s.tasks || []; s.jobs = s.jobs || []; s.shifts = s.shifts || {}; s.workouts = s.workouts || {};
      return s;
    } catch (e) {}
  }
  return defaults();
}
let S = load();
// Days before you started using the app shouldn't count as missed workouts.
if (!S.since) { const n = new Date(); S.since = [...Object.keys(S.workouts), ...Object.keys(S.shifts), `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`].sort()[0]; }
S.tomb = S.tomb || {};
S.extra = S.extra || {};
S.shakes = S.shakes || {};
S.meals = S.meals || {};
S.grocery = S.grocery || {};
S.snacks = S.snacks || {};
S.notes = S.notes || [];
// Thomas Jeffery work pays $20/h; only overwrite while he hasn't set a rate himself.
if (!S.settings.rateSet && !+S.settings.rate) S.settings.rate = 20;
{ // the Inbox is gone: anything without a day lands on today
  const n = new Date(), td = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
  S.tasks.forEach(t => { if (!t.date) { t.date = td; t.u = Date.now(); } });
}
let LAST = JSON.parse(JSON.stringify(S)); // snapshot used to spot what changed
function save() {
  stampChanges();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { island.toast('Storage is blocked — changes won’t persist'); }
  syncSoon();
}
function commit() { save(); render(); }

/* ---------- cross-device sync ----------
   Every task, job, shift and workout carries `u`, the time it last changed, and
   deletions leave a tombstone. Two devices therefore merge item by item instead
   of one overwriting the other. The sync code never leaves the device it's typed
   on except as a header; the server stores data under a hash of it. */
const SYNC = {
  code: (() => { try { return localStorage.getItem('daybook_sync_code') || ''; } catch (e) { return ''; } })(),
  at: (() => { try { return +localStorage.getItem('daybook_sync_at') || 0; } catch (e) { return 0; } })(),
  state: 'off', err: '', busy: false, timer: null,
};
const stripU = o => { const c = { ...o }; delete c.u; return c; };
const same = (a, b) => JSON.stringify(stripU(a || {})) === JSON.stringify(stripU(b || {}));
function stampChanges() {
  const now = Date.now(), prev = LAST || {};
  ['tasks', 'jobs', 'notes', 'courses'].forEach(k => {

  const to = e.composedPath()[0];   // the city's HUD is in a shadow root, where e.target is only its host

    island.toast('Task deleted', { action: { label: 'Undo', fn: () => { if (!S.tasks.some(x => x.id === id)) S.tasks.push(JSON.parse(snap)); commit(); island.toast('Restored'); } } });
  },
  noteAdd(text) { const v = String(text || '').trim(); if (!v) return false; const now = Date.now(); S.notes.unshift({ id: uid(), text: v, cat: null, pin: false, created: now, edited: now }); haptic(); commit(); island.toast('Note saved', { icon: I.notes, color: '#bf5af2' }); return true; },
  note(id) { const n = S.notes.find(x => x.id === id); return n ? { id: esc(n.id), text: esc(n.text), pin: !!n.pin } : null; },
  // while he types it only saves; when he leaves the box the pages catch up
  noteSet(id, text, done) { const n = S.notes.find(x => x.id === id); if (!n) return; if (n.text !== text) { n.text = String(text); n.edited = Date.now(); } if (done) commit(); else save(); },
  notePin(id) { const n = S.notes.find(x => x.id === id); if (!n) return; n.pin = !n.pin; haptic(); commit(); },
  noteDel(id) {
    const i = S.notes.findIndex(x => x.id === id); if (i < 0) return; const snap = JSON.stringify(S.notes[i]);
    S.notes.splice(i, 1); haptic(10); commit();
    island.toast('Note deleted', { action: { label: 'Undo', fn: () => { if (!S.notes.some(x => x.id === id)) S.notes.splice(Math.min(i, S.notes.length), 0, JSON.parse(snap)); commit(); island.toast('Restored'); } } });
  },
  shift(d) { const s = S.shifts[d] || {}, h = shiftHours(s); return { d, start: s.start || '', end: s.end || '', brk: s.brk ?? '', note: esc(s.note || ''), h: fh(h), on: h > 0, long: esc(longDate(d)), presets: presets().map(p => ({ ...p, label: `${t12(p.start)}–${t12(p.end)}` })) }; },
  shiftSet(d, f) {
    const s = S.shifts[d] || (S.shifts[d] = {});
    for (const k of ['start', 'end']) if (f[k] !== undefined) s[k] = /^\d\d:\d\d$/.test(f[k]) ? f[k] : '';
    if (f.brk !== undefined) s.brk = f.brk === '' ? '' : Math.max(0, +f.brk || 0);
    if (f.note !== undefined) { const v = String(f.note).trim().slice(0, 200); if (v) s.note = v; else delete s.note; }
    if (!s.start && !s.end && !s.note && !s.brk) delete S.shifts[d];
    haptic(6); commit();
    if (f.start !== undefined && f.end !== undefined && shiftHours(S.shifts[d])) island.toast(`${rel(d)} · ${fh(shiftHours(S.shifts[d]))}h logged`, { icon: I.hours, color: '#64d2ff' });
  },
  shiftClear(d) {
    if (!S.shifts[d]) return; const snap = JSON.stringify(S.shifts[d]); delete S.shifts[d]; haptic(10); commit();
    island.toast(`${rel(d)} shift cleared`, { action: { label: 'Undo', fn: () => { S.shifts[d] = JSON.parse(snap); commit(); island.toast('Restored'); } } });
  },
  // the city's own Progress, System (settings) and quick add, and the apartment's career drawer
  progress() {
    const xp = xpTotal(), { lvl, into, need } = levelFor(xp), got = earnedTrophies().map(t => t.id);
    return { lvl, xp, into, need, stats: [['TASKS FINISHED', doneTaskCount()], ['SESSIONS DONE', Object.values(S.workouts).filter(w => w.done).length], ['HOURS LOGGED', fh(totalHours())], ['STUDY HOURS', fh(Math.round(totalStudy() * 10) / 10)], ['CLEAN WEEKS', weekStreak()], ['DAYS CLEARED', (S.clearDays || []).length]],
      trophies: TROPHIES.map(t => ({ name: esc(t.name), hint: esc(t.hint), got: got.includes(t.id) })) };
  },
  // never the sync code itself: the city only knows whether there is one
  sys() {
    const st = S.settings;
    return { name: esc(st.name || ''), rate: st.rate || '', payCycle: +st.payCycle === 7 ? 7 : 14, payAnchor: esc(st.payAnchor || '2026-09-25'), payCutoff: st.payCutoff ?? 1, paySubmitDays: st.paySubmitDays ?? 4, extraHours: st.extraHours || '', hoursGoal: st.hoursGoal || '', appGoal: st.appGoal || '',
      push: PUSH.on, pushSay: esc(pushLabel()), brief: !!st.remindDaily, remindAt: esc(st.remindAt || '08:00'), nag: st.nag == null ? 240 : +st.nag, sound: SND.on, amb: SND.amb, own: window.OwnRing ? { has: OwnRing.O.has, name: esc(OwnRing.O.name), secs: OwnRing.O.secs, kept: OwnRing.O.kept } : null, perf: perfNow().pick, perfSay: esc(perfLabel()), probs: probCount(), sync: !!SYNC.code, syncSay: esc(syncLabel()), build: BUILD };
  },
  setting(k, v) {
    const num = ['rate', 'hoursGoal', 'appGoal', 'payCycle', 'extraHours', 'payCutoff', 'paySubmitDays'];
    if (![...num, 'name', 'payAnchor', 'remindAt'].includes(k)) return;
    if (k === 'rate') S.settings.rateSet = true;
    S.settings[k] = num.includes(k) ? (+v || 0) : String(v); commit();
  },
  syncOn(code) { const v = String(code || '').trim(); if (v.length < 16) { island.toast('That code looks too short'); return false; } setSyncCode(v); return true; },
  // quick add: what it would do, then do it. A plain task goes to today rather than opening the compose sheet
  quickSay(v) { const r = String(v || '').trim() ? parseQuick(v) : null, d = describe(r); return d ? { kind: r.kind || 'task', title: esc(d.title), chips: d.chips.map(c => esc(c)) } : null; },
  quick(v) { const r = String(v || '').trim() ? parseQuick(v) : null; return r ? !!applyQuick(r) : false; },
  jobs() {
    return { statuses: Object.entries(STATUSES), list: [...S.jobs].sort((a, b) => (b.created || 0) - (a.created || 0)).map(j => ({ id: esc(j.id), company: esc(j.company), role: esc(j.role || ''), link: /^https?:\/\//i.test(j.link || '') ? esc(j.link) : '', status: j.status, c: STATUSES[j.status] || '#8e8e93', date: j.date ? short(j.date).toUpperCase() : '' })) };
  },
  jobStatus(id, v) {
    const j = S.jobs.find(x => x.id === id); if (!j || !STATUSES[v] || j.status === v) return;
    if (v === 'Applied' && j.status === 'Wishlist') j.date = today(); j.status = v; (j.history = j.history || []).push({ s: v, d: today() }); haptic(6); commit();
    if (v === 'Offer') celebrate(`Offer from ${j.company}`, '#30d158');
  },
  jobAdd(company, role, link) {
    company = String(company || '').trim(); if (!company) return false;
    S.jobs.push({ id: uid(), created: Date.now(), company, role: String(role || '').trim(), link: String(link || '').trim(), status: 'Wishlist', date: today(), notes: '' });
    haptic(); commit(); island.toast(`${company} added`, { icon: I.jobs, color: '#30d158' }); return true;
  },
  jobDel(id) {
    const i = S.jobs.findIndex(x => x.id === id); if (i < 0) return; const snap = JSON.stringify(S.jobs[i]);
    S.jobs.splice(i, 1); haptic(10); commit();
    island.toast('Removed', { action: { label: 'Undo', fn: () => { if (!S.jobs.some(x => x.id === id)) S.jobs.push(JSON.parse(snap)); commit(); island.toast('Restored'); } } });
  },
  // the castle: School in place. Typed text is escaped here, like everything else the HUD writes into its markup.
  school(wk) {
    const sc = school(), td = today(), mon = wk && isDate(wk) ? mondayOf(parse(wk)) : mondayOf(new Date()), g = schoolGroups(), nd = nextDue(), c = curCourse(), nc = nextCourse(), r = res(), clk = S.studyClock;
    const url = u => !u ? '' : esc(/^https?:\/\//i.test(u) ? u : 'https://' + u);
    const row = t => ({ id: esc(t.id), title: esc(t.title), course: esc(courseLabel(t.course)), courseId: esc(t.course || ''), type: esc(t.type || ''), date: t.date, due: esc(dueSay(t.date)).toUpperCase(), day: short(t.date).toUpperCase(), done: !!t.done, late: !t.done && t.date < td, note: esc(t.note || ''), link: /^https?:\/\//i.test(t.note || '') ? esc(t.note) : '' });
    const cw = c ? courseWeek(c) : null;
    return { set: !!(S.school && S.school.on), goal: +sc.goal || 15, stream: sc.stream, track: sc.track, link: url(sc.link), linkRaw: esc(sc.link), streams: SCH_STREAMS, tracks: SCH_TRACKS, types: SCH_TYPES,
      mon: iso(mon), isNow: iso(mon) === iso(mondayOf(new Date())), weekLabel: esc(weekLabel(mon)).toUpperCase(), hours: weekStudy(mon), total: totalStudy(),
      days: datesOf(mon).map((d, i) => ({ d, dow: DOW[i].toUpperCase(), day: parse(d).getDate(), long: esc(longDate(d)), today: d === td, h: studyHours(d), s: studyOn(d).map((x, j) => ({ i: j, start: x.start, end: x.end, course: esc(x.course || ''), label: esc(courseLabel(x.course)), h: sessHours(x) })) })),
      clock: clk ? { on: true, ms: studyElapsed(), course: esc(clk.course || ''), label: esc(courseLabel(clk.course)), since: t12(hm(new Date(clk.startTs))) } : { on: false, ms: 0 },
      over: g.over.map(row), week: g.week.map(row), later: g.later.map(row), done: g.done.slice(0, 20).map(row), doneN: g.done.length, next: nd ? row(nd) : null,
      course: c ? { id: esc(c.id), code: esc(c.code), name: esc(c.name), n: cw.n, of: cw.of, hours: courseHours(c), end: short(c.end).toUpperCase(), link: url(c.link || sc.link) } : null,
      upNext: nc ? { code: esc(nc.code), name: esc(nc.name), start: short(nc.start).toUpperCase(), days: daysBetween(td, nc.start) } : null,
      courses: coursesSorted().map(x => ({ id: esc(x.id), code: esc(x.code), name: esc(x.name), start: x.start, end: x.end, link: esc(x.link), when: x.start ? (short(x.start) + (x.end ? ' / ' + short(x.end) : '')).toUpperCase() : 'NO DATES', now: !!(c && c.id === x.id), past: !!(x.end && x.end < td) })),
      res: sc.stream === 'blended' ? { start: r.start, end: r.end, say: esc(resSay()).toUpperCase(), days: r.start ? daysBetween(td, r.start) : null, list: r.list.map(x => ({ id: esc(x.id), t: esc(x.t), done: !!x.done })) } : null };
  },
  // every School edit goes through the same SCHOOL the page uses
  schoolDo(name, ...a) { if (Object.prototype.hasOwnProperty.call(SCHOOL, name)) return SCHOOL[name](...a); },
  // the app's own rest timer, the one the island shows between sets
  rest(sec) { haptic(8); startRest(sec); },
  restLeft: () => REST ? Math.max(0, REST.end - Date.now()) : 0,
  // the Plan page's tick, with the Undo the city promises: a page can tap again, a room shouldn't have to
  tick(id, date) {
    if (!S.tasks.some(x => x.id === id)) return;
    const undo = this.undoTask(id); toggleTask(id, date);
    const t = S.tasks.find(x => x.id === id);
    const msg = isDone(t, date) ? 'Done' : 'Not done', me = this.tickN = (this.tickN || 0) + 1; island.toast(msg, { action: undo });
    // clearing the day or earning a trophy celebrates over the toast: once that has had its moment, offer the Undo again
    setTimeout(() => { if (me === this.tickN && !undo.used && island.mode === 'toast' && island.big && !island.action) island.toast(msg, { action: undo }); }, 2200);
  },
  // the action says what it really did (+2h can mean skipped for tonight); this only adds the Undo
  decide(a, id) {
    if (!S.tasks.some(x => x.id === id)) return;
    const undo = this.undoTask(id); this.act(a, { id });
    const said = island.el.querySelector('.il-t'); island.toast(said ? said.textContent : 'Done', { action: undo });
  },
  // only this task goes back: a sync can land while the toast is up, and restoring everything would delete what it brought
  undoTask(id) { const snap = JSON.stringify(S.tasks.find(x => x.id === id)), u = { label: 'Undo', used: false, fn: () => { u.used = true; const i = S.tasks.findIndex(x => x.id === id); if (i >= 0) S.tasks[i] = JSON.parse(snap); commit(); island.toast('Restored'); } }; return u; },
  // no WebGL, or city.js wouldn't load. Arcadia is the city, so this says why and keeps what works without 3D:
  // sync carries on underneath, and a backup and the problem log are a tap away
  fallback(msg, e) {
    window.logProblem('city', e || msg);
    window.City = undefined;
    const h = $('#cityHost'); if (h) h.remove();
    let el = $('#noCity'); if (!el) { el = document.createElement('div'); el.id = 'noCity'; el.setAttribute('role', 'alert'); document.body.append(el); }
    el.innerHTML = `<div class="nc"><i class="nc-c tl"></i><i class="nc-c br"></i><b>ARCADIA</b><span class="nc-t">CITY OFFLINE</span><p>${esc(msg)}</p><p>Arcadia runs in 3D. Reload, or open it in Safari or Chrome with hardware acceleration on. Your data is safe and still syncs.</p>
      <div class="nc-a"><button type="button" data-nc="reload">RELOAD</button><button type="button" data-nc="export">EXPORT BACKUP</button><button type="button" data-nc="copy-log">COPY PROBLEM LOG</button></div></div>`;
    el.onclick = ev => { const b = ev.target.closest('[data-nc]'); if (!b) return; if (b.dataset.nc === 'reload') location.reload(); else this.act(b.dataset.nc); };
  },
};

/* ---------- boot ---------- */
island.el = $('#island');
// A short boot sequence on a cold open; tapping skips it.
(function boot() {
  const el = $('#boot');
  if (!el) return;
  if (REDUCED || sessionStorage.getItem('daybook_booted')) { el.remove(); return; }
  try { sessionStorage.setItem('daybook_booted', '1'); } catch (e) {}
  const { lvl } = levelFor(xpTotal());
  const n = new Date();
  // the city's opening, in its HUD style; it hands over to the city's loading bar
  const hm = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
  $('#bootLine').textContent = `LV ${lvl} // ${DOW_LONG[(n.getDay() + 6) % 7].toUpperCase()} // ${hm}`;
  const end = () => { el.classList.add('gone'); setTimeout(() => el.remove(), 500); };
  el.addEventListener('click', end);
  setTimeout(end, 1750);
})();

migrateProgram();
render();
loadProgram();
if (SYNC.code) { stashCode(SYNC.code); syncNow(); }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
