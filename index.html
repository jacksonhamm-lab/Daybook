<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Daybook</title>
<meta name="description" content="Work hours, tasks, training and job applications in one place.">
<meta name="theme-color" content="#05060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --glow{syntax:'<color>';inherits:true;initial-value:#0a84ff}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{
  --bg:#05060a;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --fill:rgba(118,118,128,.22);
  --stroke:rgba(255,255,255,.085); --stroke2:rgba(255,255,255,.16); --sep:rgba(255,255,255,.07);
  --text:#f5f5f7; --text2:rgba(235,235,245,.62); --text3:rgba(235,235,245,.34);
  --blue:#0a84ff; --indigo:#5e5ce6; --teal:#64d2ff; --green:#30d158; --orange:#ff9f0a; --yellow:#ffd60a; --red:#ff453a; --pink:#ff375f; --purple:#bf5af2; --gray:#8e8e93;
  --spring:cubic-bezier(.34,1.56,.64,1); --ios:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.2,.8,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;
  --glow:#0a84ff; transition:--glow .9s ease;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:15px/1.4 var(--font);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
html,body,button,a,input,select,textarea,label,[data-act],[data-tab]{touch-action:manipulation}
button,.set,.chip,.pill,.mini,.dtile,.wtile,.jrow,.nitem,.ck,.tb,.eb{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{cursor:default}
a{color:inherit}
input,select,textarea{background:var(--fill);border:1px solid transparent;border-radius:11px;padding:9px 12px;outline:none;min-width:0;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:color-mix(in srgb,var(--glow) 80%,transparent);background:rgba(118,118,128,.3)}
input::placeholder,textarea::placeholder{color:var(--text3)}
input[type=time],input[type=date],select{color-scheme:dark}
input[type=number]{-moz-appearance:textfield}
::selection{background:color-mix(in srgb,var(--glow) 55%,transparent)}
.num,.tab-num{font-variant-numeric:tabular-nums}

/* ambient PS5-style backdrop */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient::before{content:"";position:absolute;inset:-20%;background:
  radial-gradient(40% 35% at 18% 8%,color-mix(in srgb,var(--glow) 42%,transparent),transparent 70%),
  radial-gradient(35% 30% at 88% 4%,color-mix(in srgb,var(--glow) 20%,transparent),transparent 70%),
  radial-gradient(60% 45% at 60% 110%,rgba(46,58,110,.45),transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
.ambient::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0,rgba(5,6,10,.4) 60%,var(--bg) 100%)}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-4%,3%,0) scale(1.08)}}

/* top bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:calc(12px + env(safe-area-inset-top)) 28px 12px;background:rgba(5,6,10,.5);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--sep)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.025em}
.brand img{width:30px;height:30px;border-radius:8px}
.top .sp{flex:1}
.kbd{font-size:11px;color:var(--text3);border:1px solid var(--stroke2);border-radius:6px;padding:1px 6px;margin-left:4px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--glow),#1c1c22);display:grid;place-items:center;font-weight:700;font-size:14px;transition:transform .3s var(--spring)}
.avatar:hover{transform:scale(1.08)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:background .3s,box-shadow .3s}
.sync-dot.off{display:none}
.sync-dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.sync-dot.err{background:var(--red);box-shadow:0 0 8px var(--red)}
.sync-dot.syncing{background:var(--teal);animation:pulseDot 1.2s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}

/* segmented control */
.seg{position:relative;display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;isolation:isolate}
.seg>button{position:relative;z-index:1;padding:7px 15px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap;transition:color .25s}
.seg>button.on{color:var(--text)}
.seg>button:hover{color:var(--text)}
.seg .ind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:rgba(255,255,255,.16);box-shadow:0 3px 10px rgba(0,0,0,.3),inset 0 0 0 .5px rgba(255,255,255,.1);transition:left .5s var(--spring),width .5s var(--spring)}
.seg.noanim .ind{transition:none}
.seg b{font-weight:600;color:var(--text3);margin-left:5px}

/* bottom tab bar (mobile) */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(18,18,22,.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--sep)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:10px;font-weight:600;color:var(--text3);transition:color .25s}
.tabbar button svg{width:25px;height:25px;transition:transform .4s var(--spring)}
.tabbar button.on{color:var(--glow)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.08)}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{display:none;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:41;width:56px;height:56px;border-radius:50%;background:#fff;color:#000;box-shadow:0 12px 30px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.06);place-items:center;transition:transform .35s var(--spring)}
.fab:active{transform:scale(.9)}
.fab svg{width:26px;height:26px}

/* layout */
.main{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 28px 120px}
.view{display:none}.view.on{display:block}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:40px 0 26px}
.kicker{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb,var(--glow) 75%,#fff)}
.hero h1{margin:6px 0 0;font-size:clamp(34px,5vw,58px);line-height:1.02;font-weight:800;letter-spacing:-.04em}
.hero p{margin:10px 0 0;font-size:17px;color:var(--text2);max-width:60ch}
.hero-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wnav{display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.g3{grid-column:span 3}.g4{grid-column:span 4}.g5{grid-column:span 5}.g6{grid-column:span 6}.g7{grid-column:span 7}.g8{grid-column:span 8}.g12{grid-column:1/-1}
@media(max-width:1100px){.g3,.g4,.g5,.g6,.g7,.g8{grid-column:span 6}.gm12{grid-column:1/-1}}
@media(max-width:760px){
  .grid>*{grid-column:1/-1!important}
  .main{padding:0 16px calc(110px + env(safe-area-inset-bottom))}
  .top{padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .top .nav,.top .qa-btn{display:none}
  .tabbar{display:flex}.fab{display:grid}
  .hero{padding:22px 0 18px}
  .hero p{font-size:15px}
  .hero-r{width:100%}
  .wnav{margin-left:auto}
}

/* cards */
.card{position:relative;background:var(--glass);border:1px solid var(--stroke);border-radius:26px;padding:22px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -30px rgba(0,0,0,.8)}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.ch h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.025em}
.sub{color:var(--text2);font-size:13px}
.muted{color:var(--text3)}
.lbl{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:22px}
.row.fill>*{flex:1}
.empty{color:var(--text3);font-size:14px;padding:14px 4px}

/* enter animations */
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.975)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
.enter .anim{animation:cardIn .75s var(--ios) both;animation-delay:calc(var(--i,0)*60ms)}
.enter-l .anim{animation:inL .55s var(--ios) both;animation-delay:calc(var(--i,0)*28ms)}
.enter-r .anim{animation:inR .55s var(--ios) both;animation-delay:calc(var(--i,0)*28ms)}

/* buttons & chips */
.btn{height:38px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;background:var(--glass2);border:1px solid var(--stroke);white-space:nowrap;transition:transform .3s var(--spring),background .2s,box-shadow .3s;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.15)}
.btn:active{transform:scale(.95)}
.btn.icon{width:38px;padding:0;font-size:20px}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn.lg{height:54px;padding:0 26px;font-size:17px}
.btn.fill{background:var(--c,var(--blue));border-color:transparent;color:#fff}
.btn.fill:hover{filter:brightness(1.1)}
.btn.tint{background:color-mix(in srgb,var(--c,var(--blue)) 18%,transparent);border-color:transparent;color:color-mix(in srgb,var(--c,var(--blue)) 85%,#fff)}
.btn.tint:hover{background:color-mix(in srgb,var(--c,var(--blue)) 28%,transparent)}
.btn.white{background:#fff;color:#000;border-color:#fff}
.btn.white:hover{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.2)}
.btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;white-space:nowrap;flex:none;border-radius:999px;display:inline-flex;align-items:center;gap:7px;background:var(--fill);font-size:13px;font-weight:600;color:var(--text);transition:transform .3s var(--spring),background .2s,color .2s}
.chip:hover{background:rgba(118,118,128,.34)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--c,#f5f5f7);color:var(--on,#000)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on .dot{background:#fff}
.chip-date{height:34px;padding:0 10px;border-radius:999px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 85%,#fff);white-space:nowrap}
.pbar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.pbar i{display:block;height:100%;width:calc(var(--p)*100%);border-radius:3px;background:var(--c,var(--glow));transition:--p 1.1s var(--ease)}

/* rings */
.rings-wrap{display:flex;align-items:center;gap:26px}
.rings{width:min(190px,42vw);height:auto;aspect-ratio:1;flex:none;filter:drop-shadow(0 8px 24px rgba(0,0,0,.45))}
.ring{fill:none;stroke-linecap:round;stroke-dasharray:calc(var(--C)*1px);stroke-dashoffset:calc(var(--C)*(1 - var(--p))*1px);transition:--p 1.5s var(--ease)}
.ring-t{fill:none}
@media(max-width:480px){.rings-wrap{gap:16px}.lgd .v{font-size:22px!important}.lgd .v small{font-size:13px!important}.legend{gap:10px!important}}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.lgd{display:flex;flex-direction:column;cursor:pointer;border-radius:12px;padding:2px 0;transition:transform .3s var(--spring)}
.lgd:hover{transform:translateX(3px)}
.lgd .k{font-size:13px;font-weight:600;color:var(--c)}
.lgd .v{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.lgd .v small{font-size:15px;color:var(--text2);font-weight:600;margin-left:3px}

/* clock */
.timer{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0 6px}
.timer small{font-size:22px;color:var(--text2);margin-left:4px}
.live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,69,58,.6);animation:pulse 1.8s infinite}
.live-dot.brk{background:var(--orange);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,69,58,.55)}70%{box-shadow:0 0 0 12px rgba(255,69,58,0)}100%{box-shadow:0 0 0 0 rgba(255,69,58,0)}}
.clockin{width:100%;margin-top:4px;--c:var(--blue);box-shadow:0 10px 30px -8px color-mix(in srgb,var(--blue) 70%,transparent)}
.clockin svg{width:20px;height:20px}

/* session art tiles */
.tilecard{padding:0;overflow:hidden}
.art{position:relative;min-height:250px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;color:#fff;overflow:hidden;border-radius:inherit;isolation:isolate}
.art::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.28),transparent 45%),linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}
.art::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transform:translateX(-100%);transition:transform 1.1s var(--ease)}
@media(hover:hover){.art:hover::after{transform:translateX(100%)}}
.wm{position:absolute;z-index:-1;right:-6px;top:-34px;font-size:170px;font-weight:800;letter-spacing:-.07em;opacity:.16;line-height:1}
.art .code{font-size:13px;font-weight:700;letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.art .nm{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.art .ds{font-size:15px;opacity:.85}
.art .pbar{background:rgba(255,255,255,.25);margin:12px 0 4px}
.art .pbar i{background:#fff}
.art .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.art .foot .sub{color:rgba(255,255,255,.8)}
.badge{position:absolute;top:18px;right:18px;display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);font-size:12px;font-weight:700}

/* PS5 focus ring */
.focusable{transition:transform .5s var(--spring),box-shadow .35s ease,background .25s}
.focusable.sel{transform:scale(1.035);box-shadow:0 0 0 2.5px #fff,0 0 30px 2px rgba(255,255,255,.22),0 24px 50px -16px rgba(0,0,0,.9);z-index:2}
@media(hover:hover){.focusable:hover{transform:scale(1.035);box-shadow:0 0 0 2.5px #fff,0 0 30px 2px rgba(255,255,255,.22),0 24px 50px -16px rgba(0,0,0,.9);z-index:2}}
@media(hover:hover){.focusable:active{transform:scale(1.01)}}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;min-height:40px;border-radius:14px;transition:background .2s,box-shadow .2s}
.task{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;position:relative;transition:background .2s}
.task+.task{box-shadow:0 -1px 0 var(--sep)}
.task:hover{background:rgba(255,255,255,.045)}
.task[draggable=true]{cursor:grab}
.task.dragging{opacity:.35}
.ck{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 75%,transparent);display:grid;place-items:center;transition:background .25s,border-color .25s,transform .45s var(--spring)}
.ck{position:relative}.ck::after{content:"";position:absolute;inset:-10px;border-radius:50%}
.ck:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
.ck svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .35s var(--ease) .08s}
.task.done .ck{background:var(--c);border-color:var(--c)}
.task.done .ck svg{stroke-dashoffset:0}
.tb{flex:1;min-width:0;cursor:pointer}
.tt{font-size:15px;overflow-wrap:anywhere;transition:color .3s,opacity .3s}
.task.done .tt{color:var(--text3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.28)}
.tm{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:12px;color:var(--text3)}
.tm .cd{width:7px;height:7px;border-radius:50%;background:var(--c)}
.tm svg{width:12px;height:12px}
.fx-in{animation:taskIn .55s var(--spring) both}
@keyframes taskIn{from{opacity:0;transform:translateY(-10px) scale(.95)}}
.pop{animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.drop.over{background:color-mix(in srgb,var(--glow) 13%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--glow) 65%,transparent)}
.qadd{display:flex;align-items:center;gap:10px;margin-top:8px;padding:4px 8px;border-radius:12px;transition:background .2s}
.qadd:focus-within{background:rgba(255,255,255,.05)}
.qadd .plus{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--glow) 22%,transparent);color:color-mix(in srgb,var(--glow) 80%,#fff);font-size:18px;font-weight:600}
.qadd input{flex:1;background:none;border:0;padding:8px 0;font-size:15px}
.qadd input:focus{background:none}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--red) 12%,transparent);color:color-mix(in srgb,var(--red) 80%,#fff);font-size:14px;font-weight:600;margin-bottom:8px}

/* next up */
.nlist{display:flex;flex-direction:column;gap:6px}
.nitem{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:rgba(255,255,255,.035);transition:background .2s,transform .35s var(--spring)}
.nitem:hover{background:rgba(255,255,255,.06)}
.nitem .ni{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 85%,#fff)}
.nitem .ni svg{width:20px;height:20px}
.nitem .nb{flex:1;min-width:0}
.nitem b{display:block;font-size:14px;font-weight:600}
.nitem span{font-size:13px;color:var(--text2)}

/* week */
.strip,.wtiles,.board{position:relative}
/* Week row (phones/tablets): all 7 days always fit, like the iOS Calendar week bar. No sideways scrolling. */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:16px;padding:6px;border-radius:24px;background:var(--glass);border:1px solid var(--stroke)}
.dtile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 10px;border-radius:18px;transition:background .25s}
.dtile .dw{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.dtile .dn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .25s,color .25s,transform .4s var(--spring)}
.dtile.past .dn{color:var(--text3)}
.dtile.today .dn,.dtile.today .dw{color:var(--red)}
.dtile.sel .dn{background:#fff;color:#000}
.dtile.sel.today .dn{background:var(--red);color:#fff}
.dtile:active .dn{transform:scale(.88)}
.dtile .dots{display:flex;gap:3px;height:6px}
.dtile .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.dtile .dots i.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.dnum{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1.15;width:max-content}
.dnum.today{background:var(--red);color:#fff;border-radius:999px;padding:0 10px;margin-left:-4px}
@keyframes swapIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.swap{animation:swapIn .35s var(--ios) both}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:1180px){.board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.board .col{flex:0 0 250px;scroll-snap-align:start}}
.col{padding:14px 12px 10px;border-radius:22px;min-height:330px;display:flex;flex-direction:column}
.col.today{border-color:rgba(255,69,58,.4);box-shadow:0 0 0 1px rgba(255,69,58,.25),0 20px 50px -30px rgba(255,69,58,.5)}
.col-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 10px}
.col-h .dw{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.col .dnum{font-size:24px}
.col .tasks{flex:1;margin:4px -4px 0;padding:2px}
.col .task{padding:8px 4px;gap:9px}
.col .tt{font-size:13.5px}
.col .ck{width:20px;height:20px}
.col .ck svg{width:12px;height:12px}
.col .qadd{margin:4px -4px 0;padding:2px 4px}
.col .qadd input{font-size:13.5px}
.col .qadd .plus{width:20px;height:20px;font-size:15px}
.mini{display:flex;align-items:center;gap:7px;width:100%;margin-bottom:6px;padding:7px 10px;border-radius:11px;font-size:12px;font-weight:600;text-align:left;background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 80%,#fff);transition:background .2s,transform .3s var(--spring);position:relative;overflow:hidden}
.mini:hover{background:color-mix(in srgb,var(--c) 26%,transparent)}
.mini:active{transform:scale(.97)}
.mini.ghost{--c:#8e8e93;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:var(--text3)}
.mini.ghost:hover{color:var(--text)}
.mini .mb{position:absolute;left:0;bottom:0;height:2px;width:calc(var(--p)*100%);background:var(--c);transition:--p 1s var(--ease)}
.mini .ok{margin-left:auto}

/* hours */
.srow{display:grid;grid-template-columns:90px minmax(0,1fr) 84px 200px;align-items:center;gap:14px;padding:12px 8px;border-radius:16px;transition:background .2s}
.srow+.srow{box-shadow:0 -1px 0 var(--sep)}
.srow:hover{background:rgba(255,255,255,.035)}
.srow.today .sd b{color:var(--red)}
.sd b{display:block;font-size:17px;font-weight:700}
.sd span{font-size:12px;color:var(--text3)}
.sin{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sin input[type=time]{width:122px;font-variant-numeric:tabular-nums}
.sin .to{color:var(--text3)}
.bk{display:flex;align-items:center;gap:6px;color:var(--text3);font-size:13px}
.bk input{width:62px;text-align:center}
.sh{font-size:22px;font-weight:700;letter-spacing:-.03em;text-align:right;font-variant-numeric:tabular-nums}
.sh small{font-size:13px;color:var(--text2);margin-left:2px}
.sx{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.sx .chip{height:30px;padding:0 11px;font-size:12px}
.xbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text3);transition:background .2s,color .2s}
.xbtn:hover{background:var(--fill);color:var(--text)}
@media(max-width:760px){.srow{grid-template-columns:1fr auto;row-gap:10px}.sin{grid-column:1/-1;order:3}.sx{grid-column:1/-1;order:4;justify-content:flex-start}.sh{order:2}}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;position:relative;margin-top:26px}
.bars .bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.bars .b{width:100%;max-width:38px;border-radius:9px 9px 5px 5px;background:color-mix(in srgb,var(--teal) 32%,transparent);height:calc(var(--p)*100%);min-height:4px;transition:--p 1.1s var(--ease);position:relative}
.bars .bc.cur .b{background:linear-gradient(180deg,var(--teal),var(--blue));box-shadow:0 0 24px -4px var(--teal)}
.bars .b span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap}
.bars .bl{font-size:11px;color:var(--text3);font-weight:600}
.avg{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(255,255,255,.25);pointer-events:none}
.avg span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--text3)}
.exrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--text2)}
.exrow i{font-style:normal;color:var(--text3)}
.exrow input{width:64px;padding:6px 8px;text-align:center;font-size:14px}
.submitbox{margin-top:14px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--teal) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--teal) 25%,transparent)}
.sb-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.sb-head b{font-size:15px}
.sb-head span{font-size:15px;font-weight:700;color:color-mix(in srgb,var(--teal) 85%,#fff)}
.sb-days{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sb-days span{padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12px;font-weight:600}
.pws{display:flex;gap:10px;margin-top:14px}
.pw{flex:1;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04)}
.pw span{display:block;font-size:12px;color:var(--text2);font-weight:600}
.pw b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.big small{font-size:18px;color:var(--text2);font-weight:600;margin-left:4px}
.shift-ed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.shift-ed label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text2);font-weight:600;min-width:0}
.shift-ed input{width:100%;font-size:17px;padding:11px 12px}
@media(max-width:480px){.shift-ed{grid-template-columns:repeat(2,minmax(0,1fr))}.shift-ed label:last-child{grid-column:1/-1}}
.art .foot>*{min-width:0}

/* training */
.wtiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.wtile{border-radius:22px;overflow:hidden;text-align:left;position:relative}
.wtile .art{min-height:180px;padding:14px}
.wtile .wm{font-size:110px;top:-20px}
.wtile .nm{font-size:17px}
.wtile .code{font-size:11px}
.wtile .dnum{font-size:13px;font-weight:700;position:absolute;top:12px;left:14px;opacity:.9}
.wtile .dnum.today{padding:1px 8px;margin:0}
.wtile .badge{top:10px;right:10px;padding:3px 8px;font-size:11px}
@media(max-width:900px){.wtiles{display:flex;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:6px 16px 12px;scrollbar-width:none}.wtiles::-webkit-scrollbar{display:none}.wtile{flex:0 0 150px;scroll-snap-align:start}}
.bms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.bms{grid-template-columns:1fr}}
.bm{padding:14px;border-radius:18px;background:rgba(255,255,255,.04)}
.bm .k{font-size:13px;font-weight:600;color:var(--text2)}
.bm .v{font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1.15}
.bm .v small{font-size:13px;color:var(--text3);margin-left:3px;font-weight:600}
.bm .s{font-size:12px;color:var(--text3)}
.bm svg{width:100%;height:30px;margin-top:6px;overflow:visible}
.bm form{display:flex;gap:6px;margin-top:10px}
.bm form input{flex:1;width:0;padding:7px 10px;font-size:13px}
.heatwrap{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,15px);gap:4px}
.heat i{width:15px;height:15px;border-radius:4px;background:rgba(255,255,255,.06)}
.heat i.rest{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.heat i.miss{background:color-mix(in srgb,var(--red) 30%,transparent)}
.heat i.hit{background:var(--c);box-shadow:0 0 8px -1px var(--c)}
.heat i.now{outline:2px solid #fff;outline-offset:1px}
.heatl{display:grid;grid-template-rows:repeat(7,15px);gap:4px;font-size:10px;line-height:15px;color:var(--text3);font-weight:600}
.tpl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media(max-width:620px){.tpl{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tpl label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--text2)}
.tpl select{padding:8px;font-size:13px}
.plib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plib button{border-radius:18px;overflow:hidden;text-align:left}
.plib .art{min-height:130px;padding:14px}
.plib .nm{font-size:17px}
.plib .wm{font-size:110px;top:-20px}
.fold summary{list-style:none;display:flex;align-items:baseline;gap:12px;cursor:pointer}
.fold summary::-webkit-details-marker{display:none}
.fold summary h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.025em}
.fold summary::after{content:"\203A";margin-left:auto;font-size:26px;line-height:1;color:var(--text3);transition:transform .35s var(--spring)}
.fold[open] summary::after{transform:rotate(90deg)}
.cardio-types{display:flex;gap:6px;flex-wrap:wrap}

/* jobs */
.jadd{display:grid;grid-template-columns:1.4fr 1fr 1fr auto auto;gap:10px;align-items:center}
@media(max-width:1000px){.jadd{grid-template-columns:1fr 1fr}.jadd .jl{grid-column:1/-1}}
.jrow{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:16px;cursor:pointer;transition:background .2s,transform .35s var(--spring)}
.jrow+.jrow{box-shadow:0 -1px 0 var(--sep)}
.jrow:hover{background:rgba(255,255,255,.05)}
.jav{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 45%),hsl(calc(var(--h) + 40) 70% 30%))}
.jb{flex:1;min-width:0}
.jb b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jb span{font-size:13px;color:var(--text2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr{display:flex;align-items:center;gap:8px;flex:none}
.jr a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--text2);text-decoration:none;transition:background .2s}
.jr a:hover{background:var(--fill);color:var(--text)}
.pipes{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pipe{padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.04);min-width:92px}
.pipe b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;color:color-mix(in srgb,var(--c) 85%,#fff)}
.pipe span{font-size:12px;color:var(--text2);font-weight:600}
.segwrap{overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.segwrap::-webkit-scrollbar{display:none}

/* sheets */
.ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s ease}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:71;left:50%;bottom:0;width:min(640px,100%);max-height:92dvh;overflow:auto;overscroll-behavior:contain;transform:translate(-50%,105%);background:rgba(28,28,32,.9);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--stroke2);border-bottom:0;border-radius:30px 30px 0 0;padding:8px 22px calc(26px + env(safe-area-inset-bottom));transition:transform .6s var(--ios);visibility:hidden}
.sheet.on{transform:translate(-50%,0);visibility:visible}
.sheet.dragging{transition:none}
@media(min-width:761px){
  .sheet{bottom:auto;top:50%;border-bottom:1px solid var(--stroke2);border-radius:30px;max-height:88vh;transform:translate(-50%,-46%) scale(.94);opacity:0;transition:transform .55s var(--spring),opacity .25s,visibility .55s;box-shadow:0 40px 120px rgba(0,0,0,.7)}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .grab{display:none}
}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:4px auto 16px;touch-action:none}
.sheet h2{margin:10px 0 2px;font-size:28px;font-weight:800;letter-spacing:-.035em}
.sheet .shp{margin:0;color:var(--text2)}
.sheet textarea{width:100%;resize:none;font-size:20px;font-weight:600;background:none;padding:6px 0;border:0;border-radius:0}
.sheet textarea:focus{background:none}
.sheet.compose textarea{background:var(--fill);border-radius:16px;padding:14px 16px;font-size:18px;font-weight:600;line-height:1.3;min-height:64px}
.sheet.compose .chips{gap:8px}
.sheet.compose .chip{height:40px;padding:0 16px;font-size:14px}
.sheet.compose .chip-date{height:40px}
.cmp{min-height:268px;display:flex;flex-direction:column}
.cmp .row.end{margin-top:auto}
.cmp-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.cmp-back{width:30px;height:30px;border-radius:50%;background:var(--fill);font-size:20px;line-height:1;display:grid;place-items:center}
.cmp-task{flex:1;min-width:0;font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-dots{display:flex;gap:5px}
.cmp-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .3s,transform .3s}
.cmp-dots i.on{background:#fff;transform:scale(1.25)}
.cmp-hint{font-size:13px;color:var(--text3);margin-top:12px}
@keyframes stepIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes stepBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.step-in{animation:stepIn .32s var(--ios)}
.step-back{animation:stepBack .32s var(--ios)}
.qline{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:18px 0 10px}
.sheet .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:12px;font-weight:600;color:var(--text2)}
.sheet .field input,.sheet .field textarea{font-size:16px;font-weight:400;color:var(--text);background:var(--fill);padding:11px 13px;border-radius:12px}
.sheet .field textarea{min-height:80px;resize:vertical}
.sart{margin:-8px -22px 16px;border-radius:30px 30px 0 0}
.sart .art{min-height:210px;padding:26px 24px 22px;border-radius:30px 30px 0 0}
.sart .close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);display:grid;place-items:center;font-size:18px}
.srings{display:flex;align-items:center;gap:10px}
.sec-l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:20px 0 6px}
.ex{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-radius:14px;transition:background .3s}
.ex+.ex{box-shadow:0 -1px 0 var(--sep)}
.ex .eb{flex:1;min-width:0;cursor:pointer}
.ex .en{font-size:15px;font-weight:600;transition:color .3s}
.ex .er{font-size:13px;color:var(--text2)}
.ex .ed{font-size:13px;color:var(--text2);max-height:0;overflow:hidden;opacity:0;transition:max-height .45s var(--ios),opacity .3s,margin .3s}
.ex.open .ed{max-height:120px;opacity:1;margin-top:6px}
.ex.done .en{color:var(--text3);text-decoration:line-through}
.sets{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:180px}
.set{width:36px;height:36px;border-radius:50%;background:var(--fill);font-size:13px;font-weight:700;color:var(--text2);transition:background .25s,color .25s,transform .45s var(--spring),box-shadow .3s}
@media(pointer:coarse){.set{width:42px;height:42px;font-size:14px}.sets{gap:8px;max-width:200px}}
.set:hover:not(:disabled){background:rgba(118,118,128,.36)}
.set.on{background:var(--c);color:#000;box-shadow:0 0 16px -2px var(--c)}
.set:disabled{opacity:.5}
.note{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);font-size:14px;color:var(--text2);margin-top:14px}

/* spotlight */
.spot{position:fixed;z-index:76;left:50%;top:12vh;width:min(660px,calc(100% - 24px));transform:translateX(-50%) translateY(-10px) scale(.96);opacity:0;visibility:hidden;transition:transform .45s var(--spring),opacity .2s,visibility .45s;background:rgba(32,32,38,.86);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--stroke2);border-radius:24px;box-shadow:0 40px 120px rgba(0,0,0,.7);overflow:hidden}
.spot.on{transform:translateX(-50%) scale(1);opacity:1;visibility:visible}
.spot-in{display:flex;align-items:center;gap:14px;padding:18px 22px}
.spot-in svg{width:24px;height:24px;color:var(--text2);flex:none}
.spot-in input{flex:1;background:none;border:0;padding:0;font-size:22px;font-weight:500;letter-spacing:-.02em}
.spot-in input:focus{background:none}
.spot-prev{border-top:1px solid var(--sep);padding:14px 22px;display:flex;align-items:center;gap:14px;min-height:74px}
.spot-prev .pi{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 85%,#fff)}
.spot-prev .pi svg{width:22px;height:22px}
.spot-prev b{display:block;font-size:16px}
.spot-prev .chips{margin-top:6px;gap:6px}
.spot-prev .pill{font-size:11.5px}
.spot-prev .ret{margin-left:auto;font-size:12px;color:var(--text3);white-space:nowrap}
.spot-ex{border-top:1px solid var(--sep);padding:12px 22px 16px}
.spot-ex .chips{gap:6px}
.spot-ex .chip{height:30px;font-size:12.5px;font-weight:500;color:var(--text2)}
.spot-flash{animation:flash .6s ease}
@keyframes flash{0%{background:color-mix(in srgb,var(--green) 25%,transparent)}100%{background:transparent}}

/* dynamic island */
#island{position:fixed;z-index:90;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) scale(.5);opacity:0;visibility:hidden;min-height:38px;max-width:calc(100vw - 24px);padding:8px 16px;border-radius:24px;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;white-space:nowrap;transition:transform .55s var(--spring),opacity .25s,visibility .55s,padding .4s var(--spring);cursor:pointer}
#island.on{transform:translateX(-50%) scale(1);opacity:1;visibility:visible}
#island.big{padding:12px 20px;border-radius:28px;font-size:15px}
#island .il-t{overflow:hidden;text-overflow:ellipsis}
#island b{font-variant-numeric:tabular-nums}
#island .il-ic{display:grid;place-items:center}
#island .il-ic svg{width:18px;height:18px}
#island .il-a{height:28px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.14);font-size:13px;font-weight:700}
#island .il-a:hover{background:rgba(255,255,255,.24)}
@media(min-width:761px){#island{top:76px}}
.confetti{position:fixed;z-index:95;width:9px;height:9px;border-radius:2px;pointer-events:none}

@media(pointer:coarse){input,select,textarea,.qadd input,.add input,.sheet .field input{font-size:16px!important}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<body>
<div class="ambient"></div>

<header class="top">
  <div class="brand"><img src="icons/favicon.png" alt="">Daybook</div>
  <nav class="seg nav" id="nav"></nav>
  <div class="sp"></div>
  <button class="btn qa-btn" data-act="spot-open"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Quick add<span class="kbd" id="kbdHint">Ctrl K</span></button>
  <span id="syncDot" class="sync-dot off" title="Sync status"></span>
  <button class="avatar" data-act="settings" title="Settings" id="avatar">J</button>
</header>

<main class="main" id="main">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-week"></section>
  <section class="view" id="v-hours"></section>

// Hours are due the day before payday, so a period runs up to that cut-off

  const k = Math.ceil((parse(date) - addDays(anchor, -gap)) / 864e5 / cyc);

/* ---------- animation plumbing ---------- */
let FX = {};

function animateValues(root = document) {

    const k = el.dataset.pk, to = +el.dataset.to;
    el.style.setProperty('--p', PREV[k] ?? 0);

  });

    const k = el.dataset.nk, to = +el.dataset.to, from = NPREV[k] ?? 0; NPREV[k] = to;
    const fmt = v => el.dataset.dec ? fh(Math.round(v * 4) / 4) : String(Math.round(v));

    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = p < 1 ? fmt(from + (to - from) * e) : fmt(to); if (p < 1) requestAnimationFrame(step); };

  });
}
const nk = (k, v, dec) => `<span class="num" data-nk="${k}" data-to="${v}"${dec ? ' data-dec="1"' : ''}>${dec ? fh(v) : v}</span>`;
const pbar = (k, p, c) => `<div class="pbar"${c ? ` style="--c:${c}"` : ''}><i data-pk="${k}" data-to="${clamp01(p)}"></i></div>`;
function placeInd(seg, instant) {
  let ind = seg.querySelector(':scope > .ind');
  if (!ind) { ind = document.createElement('span'); ind.className = 'ind'; seg.prepend(ind); }
  const on = seg.querySelector(':scope > button.on'); if (!on) { ind.style.width = '0'; return; }
  if (instant) seg.classList.add('noanim');
  ind.style.left = on.offsetLeft + 'px'; ind.style.width = on.offsetWidth + 'px';
  if (instant) requestAnimationFrame(() => seg.classList.remove('noanim'));
}
function pop(el) { if (!el || REDUCED) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
function collapse(el) {
  if (!el || REDUCED || !el.animate) return Promise.resolve();
  el.style.overflow = 'hidden';
  return el.animate([{ height: el.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0, paddingTop: '0px', paddingBottom: '0px' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' }).finished.catch(() => {});
}
function confetti(x, y, colors) {
  if (REDUCED) return;
  const pal = colors || ['#0a84ff', '#30d158', '#ff9f0a', '#ff375f', '#ffd60a', '#bf5af2', '#64d2ff'];
  for (let i = 0; i < 34; i++) {
    const el = document.createElement('i'); el.className = 'confetti';
    el.style.cssText = `left:${x}px;top:${y}px;background:${pal[i % pal.length]}`;
    document.body.appendChild(el);
    const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 180;
    el.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * v}px,${Math.sin(a) * v + 160}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }],
      { duration: 900 + Math.random() * 700, easing: 'cubic-bezier(.15,.7,.35,1)' }).finished.then(() => el.remove());
  }
}
function celebrate(text, color) { haptic([12, 40, 18]); island.toast(text, { icon: I.trophy, color: '#ffd60a', big: true }); confetti(innerWidth / 2, Math.min(140, innerHeight * .2), [color, '#fff', '#ffd60a']); }

/* ---------- dynamic island ---------- */
let REST = null;
const island = {
  el: null, mode: null, key: null, timer: null,
  paint(html, big) {
    const el = this.el; el.innerHTML = html; el.classList.add('on'); el.classList.toggle('big', !!big);
    if (el.animate && !REDUCED) el.animate([{ transform: 'translateX(-50%) scale(.88)' }, { transform: 'translateX(-50%) scale(1)' }], { duration: 520, easing: 'cubic-bezier(.34,1.56,.64,1)' });
  },
  toast(text, o = {}) {
    this.mode = 'toast'; this.key = null;
    this.paint(`${o.icon ? `<span class="il-ic" style="color:${o.color || '#fff'}">${o.icon}</span>` : ''}<span class="il-t">${esc(text)}</span>${o.action ? `<button class="il-a" data-il="1">${esc(o.action.label)}</button>` : ''}`, true);
    this.action = o.action ? o.action.fn : null;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { this.mode = null; this.action = null; this.live(); }, o.action ? 5000 : (o.ms || 2400));
  },
  live() {
    if (this.mode === 'toast') return;
    let key = null, html = '';
    if (REST) { key = 'rest'; html = `<span class="il-ic" style="color:#ff9f0a">${I.hours}</span><span>Rest</span><b data-rest></b><button class="il-a" data-act="rest-add">+30s</button><button class="il-a" data-act="rest-skip">Skip</button>`; }
    else if (S.clock) { key = S.clock.breakTs ? 'break' : 'clock'; html = `<span class="live-dot${S.clock.breakTs ? ' brk' : ''}"></span><span>${S.clock.breakTs ? 'On break' : 'On the clock'}</span><b data-clock></b>`; }
    if (!key) { this.el.classList.remove('on', 'big'); this.key = null; return; }
    if (key !== this.key) { this.paint(html, false); this.key = key; tick(); }
  },
};

/* ---------- views ---------- */
function hero(kicker, title, sub, right = '') {
  return `<div class="hero anim" style="--i:0"><div><div class="kicker">${kicker}</div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${right ? `<div class="hero-r">${right}</div>` : ''}</div>`;
}
const weekNav = () => `<div class="wnav"><button class="btn icon" data-act="prev" aria-label="Previous week">‹</button><button class="btn" data-act="thisweek">${isCurWeek() ? 'This week' : 'Jump to today'}</button><button class="btn icon" data-act="next" aria-label="Next week">›</button></div>`;

function taskLi(t, d, opts = {}) {
  const c = (CATS[t.cat] || CATS.life).color, done = isDone(t, d);
  const meta = [opts.showCat !== false ? `<span class="cd"></span>${CATS[t.cat].label}` : '', t.remind ? `${I.bell}${t12(t.remind)}` : '', t.repeat ? `${I.repeat}${repeatLabel(t.repeat)}` : '', opts.when ? rel(t.date) : ''].filter(Boolean).join(' · ');
  return `<li class="task ${done ? 'done' : ''} ${FX.added === t.id ? 'fx-in' : ''}" data-id="${t.id}" data-date="${d || ''}" style="--c:${c}" ${t.repeat ? '' : 'draggable="true"'}>
    <button class="ck" data-act="toggle-task" aria-label="Complete">${I.check}</button>
    <div class="tb" data-act="task-menu"><div class="tt">${esc(t.title)}</div>${meta ? `<div class="tm">${meta}</div>` : ''}</div></li>`;
}
const addForm = (d, ph) => `<form class="qadd" data-date="${d ?? ''}"><span class="plus">+</span><input placeholder="${ph}" maxlength="240" enterkeyhint="done"></form>`;

function ringsSVG(vals) {
  const R = [80, 58, 36], W = 17, grads = vals.map((v, i) => `<linearGradient id="rg${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${v.c1}"/><stop offset="1" stop-color="${v.c2}"/></linearGradient>`).join('');
  return `<svg class="rings" viewBox="0 0 200 200"><defs>${grads}</defs>${vals.map((v, i) => {
    const C = +(2 * Math.PI * R[i]).toFixed(2);
    return `<circle class="ring-t" cx="100" cy="100" r="${R[i]}" stroke="${v.c1}" stroke-opacity=".2" stroke-width="${W}"/>
      <circle class="ring" cx="100" cy="100" r="${R[i]}" stroke="url(#rg${i})" stroke-width="${W}" transform="rotate(-90 100 100)" style="--C:${C}" data-pk="ring-${v.k}" data-to="${clamp01(v.p)}"/>`;
  }).join('')}</svg>`;
}

function clockCard(d) {
  if (S.clock) {
    const c = S.clock, b = Math.round((c.brkMs + (c.breakTs ? Date.now() - c.breakTs : 0)) / 6e4);
    return `<div class="ch"><h3>On the clock</h3><span class="live-dot${c.breakTs ? ' brk' : ''}"></span></div>
      <div class="timer" data-clock>0:00:00</div>
      <div class="sub">Since ${t12(hm(new Date(c.startTs)))}${c.breakTs ? ' · on break' : ''}${b ? ` · ${b}m break` : ''}</div>
      <div class="row fill" style="margin-top:18px"><button class="btn tint" style="--c:var(--orange)" data-act="clock-break">${c.breakTs ? 'Resume' : 'Break'}</button><button class="btn fill" style="--c:var(--red)" data-act="clock-out">Clock out</button></div>`;
  }
  const sh = S.shifts[d], hr = shiftHours(sh), pr = presets();
  if (hr) return `<div class="ch"><h3>Shift</h3><button class="btn sm" data-act="open-shift" data-date="${d}">Edit</button></div>
      <div class="timer">${nk('today-shift', hr, 1)}<small>h</small></div>
      <div class="sub">${t12(sh.start)} – ${t12(sh.end)}${+sh.brk ? ` · ${sh.brk}m break` : ''}${sh.note ? ` · ${esc(sh.note)}` : ''}</div>
      <div class="row" style="margin-top:18px"><button class="btn tint" data-act="clock-in">Clock in again</button></div>`;
  return `<div class="ch"><h3>Work</h3><span class="sub">Not clocked in</span></div>
    <button class="btn lg fill clockin" data-act="clock-in">${I.play}Clock in</button>
    <div class="sub" style="margin:16px 0 8px">${pr.length ? 'Or log a usual shift' : 'Or enter times manually'}</div>
    <div class="chips">${pr.map(p => presetChip(p, d)).join('')}<button class="chip" data-act="open-shift" data-date="${d}">Custom…</button></div>`;
}

function sessionArt(d, opts = {}) {
  const w = wo(d), st = SESS[w.s], rest = w.s === 'REST';
  let foot = '';
  if (rest) {
    const next = [1, 2, 3, 4, 5, 6].map(n => iso(addDays(parse(d), n))).find(x => wo(x).s !== 'REST');
    foot = next ? `<span class="sub">Next up · ${rel(next)} · ${sessName(wo(next).s)}</span>` : '';
    foot += `<button class="btn white sm" data-act="open-session" data-date="${d}">Log cardio</button>`;
  } else {
    const lbl = w.done ? 'Review' : w.prog && w.prog.done ? 'Resume' : 'Start';
    foot = `<span class="sub">${w.prog ? `${w.prog.done}/${w.prog.total} sets` : w.s === 'HIIT' ? `${cardioOn(d).reduce((a, l) => a + l.min, 0)} min logged` : ''}</span><button class="btn white${opts.small ? ' sm' : ''}" data-act="open-session" data-date="${d}">${I.play}${lbl}</button>`;
  }
  return `<div class="art" style="background:${st.art}"><span class="wm">${rest ? 'R' : w.s}</span>
    ${w.done ? `<span class="badge">${I.check.replace('<svg', '<svg class="ico" style="width:14px;height:14px;stroke:#fff;stroke-width:3"')}Done</span>` : ''}
    <span class="code">${opts.kicker || (rest ? 'Recovery' : w.s)}</span><div class="nm">${esc(sessName(w.s))}</div><div class="ds">${esc(sessSub(w.s))}</div>
    ${w.prog ? pbar('art-' + d + (opts.small ? 's' : ''), w.prog.p) : ''}<div class="foot">${foot}</div></div>`;
}

function renderToday() {
  const d = today(), wk = curWeek(), hrs = weekHours(wk), goal = +S.settings.hoursGoal;
  const plan = wk.filter(x => wo(x).s !== 'REST'), sDone = plan.filter(x => wo(x).done).length;
  const apps = appsIn(wk), ag = +S.settings.appGoal || 0;
  const list = tasksOn(d), left = list.filter(t => !isDone(t, d)).length, ov = overdue();
  const hr = new Date().getHours(), greet = hr < 5 ? 'Late night' : hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  const w = wo(d), sh = S.shifts[d];
  const summary = [left ? `${left} task${left === 1 ? '' : 's'} left` : list.length ? 'All tasks done' : 'No tasks yet', w.s === 'REST' ? 'Rest day' : `${sessName(w.s)}${w.done ? ' ✓' : ''}`, S.clock ? 'On the clock' : shiftHours(sh) ? `${t12(sh.start)}–${t12(sh.end)} shift` : null].filter(Boolean).join(' · ');

  const follow = S.jobs.filter(needsFollow).slice(0, 3);
  const slip = slipped();
  const tmr = iso(addDays(parse(d), 1)), tw = wo(tmr), tsh = S.shifts[tmr], tTasks = tasksOn(tmr).length;
  const nexts = [
    ...follow.map(j => `<div class="nitem" style="--c:var(--green)"><div class="ni">${esc(j.company[0] || '?')}</div><div class="nb"><b>Follow up · ${esc(j.company)}</b><span>Applied ${daysBetween(j.date, d)} days ago</span></div><button class="btn tint sm" style="--c:var(--green)" data-act="followed" data-id="${j.id}">Done</button></div>`),
    `<div class="nitem" style="--c:var(--indigo)"><div class="ni">${I.week}</div><div class="nb"><b>Tomorrow</b><span>${[shiftHours(tsh) ? `${t12(tsh.start)}–${t12(tsh.end)}` : 'No shift', tw.s === 'REST' ? 'Rest' : sessName(tw.s), `${tTasks} task${tTasks === 1 ? '' : 's'}`].join(' · ')}</span></div><button class="btn sm" data-tab="week" data-sel="${tmr}">Open</button></div>`,
    (() => { const p = periodFor(today()), left = daysBetween(today(), p.end), rate = +S.settings.rate, h = periodHours(p);
      const ex = extraHours(p), total = h + ex;
      const head = left === 0 ? 'Last day to enter hours' : left === 1 ? 'Hours due tomorrow' : left < 0 ? 'Period closed' : `Hours due ${DOW_LONG[dowIdx(p.end)]}`;
      return left <= 2 && left >= -1 ? `<div class="nitem" style="--c:var(--teal)"><div class="ni">${I.hours}</div><div class="nb"><b>${head}</b><span>${fh(total)} h logged${rate ? ' · ≈ ' + money(total * rate) : ''} · paid ${DOW_LONG[dowIdx(p.payday)]}</span></div><button class="btn sm" data-tab="hours">Hours</button></div>` : ''; })(),
    ag && apps < ag ? `<div class="nitem" style="--c:var(--green)"><div class="ni">${I.jobs}</div><div class="nb"><b>${ag - apps} more application${ag - apps === 1 ? '' : 's'}</b><span>to hit ${ag} this week</span></div><button class="btn sm" data-tab="jobs">Log</button></div>` : '',
    goal && hrs < goal ? `<div class="nitem" style="--c:var(--teal)"><div class="ni">${I.hours}</div><div class="nb"><b>${fh(goal - hrs)}h to target</b><span>${fh(hrs)} of ${goal} hours this week</span></div></div>` : '',
  ].filter(Boolean).join('');

  return hero(longDate(d), `${greet}, ${esc(S.settings.name || 'there')}`, summary) + `<div class="grid">
    <section class="card g5 anim" style="--i:1"><div class="ch"><h3>This week</h3><span class="sub">${weekLabel(mondayOf(new Date()))}</span></div>
      <div class="rings-wrap">${ringsSVG([
        { k: 'h', p: hrs / (goal || 40), c1: '#0a84ff', c2: '#64d2ff' },
        { k: 't', p: plan.length ? sDone / plan.length : 0, c1: '#ff9f0a', c2: '#ffd60a' },
        { k: 'j', p: ag ? apps / ag : 0, c1: '#30d158', c2: '#a6ffcb' }])}
        <div class="legend">
          <div class="lgd" style="--c:#0a84ff" data-tab="hours"><span class="k">Hours</span><span class="v">${nk('lg-h', hrs, 1)}<small>${goal ? `/ ${goal}h` : 'h · set a target'}</small></span></div>
          <div class="lgd" style="--c:#ff9f0a" data-tab="training"><span class="k">Training</span><span class="v">${nk('lg-t', sDone)}<small>/ ${plan.length} sessions</small></span></div>
          <div class="lgd" style="--c:#30d158" data-tab="jobs"><span class="k">Applications</span><span class="v">${nk('lg-j', apps)}<small>${ag ? `/ ${ag}` : 'sent'}</small></span></div>
        </div></div></section>
    <section class="card g3 anim" style="--i:2">${clockCard(d)}</section>
    <section class="card g4 gm12 tilecard focusable anim" style="--i:3">${sessionArt(d, { kicker: w.s === 'REST' ? 'Recovery' : `Today · ${w.s}` })}</section>
    <section class="card g7 anim" style="--i:4">

      ${ov.length ? `<div class="banner"><span>${ov.length} overdue from earlier</span><button class="btn sm tint" style="--c:var(--red)" data-act="rollover">Move to today</button></div>` : ''}
      <ul class="tasks drop" data-drop="${d}">${list.map(t => taskLi(t, d)).join('') || '<li class="empty">Nothing yet. Add something below or press Ctrl K.</li>'}</ul>
      ${addForm(d, 'Add a task… try “call Tim fri #work”')}

      ${slip.map(t => `<div class="nitem" style="--c:${CATS[t.cat].color}"><div class="ni">${I.bell}</div><div class="nb"><b>${esc(t.title)}</b><span>Was due ${t12(t.remind)}</span></div>
        <button class="btn sm tint" style="--c:var(--green)" data-act="rm-done" data-id="${t.id}">Done</button>
        <button class="btn sm" data-act="rm-later" data-id="${t.id}">+2h</button>
        <button class="btn sm" data-act="rm-tomorrow" data-id="${t.id}">Tomorrow</button></div>`).join('')}</section>` : ''}
    <section class="card g5 anim" style="--i:5"><div class="ch"><h3>Up next</h3></div><div class="nlist">${nexts || '<div class="empty">All clear.</div>'}</div></section>
  </div>`;
}

function renderWeek() {
  const dates = weekDates(), td = today(), hrs = weekHours(dates);
  const plan = dates.filter(d => wo(d).s !== 'REST'), sDone = plan.filter(d => wo(d).done).length;
  const all = dates.flatMap(d => tasksOn(d).map(t => isDone(t, d))), left = all.filter(x => !x).length;
  if (!S.ui.selDay || !dates.includes(S.ui.selDay)) S.ui.selDay = dates.includes(td) ? td : dates[0];
  const mode = weekMode();
  const right = weekNav();
  let body = '';
  if (mode === 'board') {
    body = `<div class="board">${dates.map((d, i) => {
      const w = wo(d), sh = S.shifts[d], h = shiftHours(sh), list = tasksOn(d);
      const shiftBtn = h ? `<button class="mini" style="--c:var(--blue)" data-act="open-shift" data-date="${d}">${t12(sh.start)}–${t12(sh.end)}<span class="ok">${fh(h)}h</span></button>` : `<button class="mini ghost" data-act="open-shift" data-date="${d}">+ Shift</button>`;
      const woBtn = w.s === 'REST' ? `<button class="mini ghost" data-act="open-session" data-date="${d}">Rest</button>` : `<button class="mini" style="--c:${SESS[w.s].color}" data-act="open-session" data-date="${d}">${w.s} · ${esc(sessName(w.s))}<span class="ok">${w.done ? '✓' : ''}</span>${w.prog ? `<i class="mb" data-pk="mb-${d}" data-to="${w.prog.p}"></i>` : ''}</button>`;
      return `<div class="card col anim ${d === td ? 'today' : ''}" style="--i:${i + 1}"><div class="col-h"><span class="dw">${DOW[i]}</span><span class="dnum ${d === td ? 'today' : ''}">${parse(d).getDate()}</span></div>
        ${shiftBtn}${woBtn}<ul class="tasks drop" data-drop="${d}">${list.map(t => taskLi(t, d, { showCat: false })).join('')}</ul>${addForm(d, 'Add')}</div>`;
    }).join('')}</div>`;
  } else {
    const sd = S.ui.selDay;
    body = `<div class="strip anim" style="--i:1">${dates.map((d, i) => {
      const w = wo(d), open = tasksOn(d).some(t => !isDone(t, d)), h = shiftHours(S.shifts[d]);
      const dots = [w.s !== 'REST' ? `<i class="${w.done ? '' : 'o'}" style="--c:${SESS[w.s].color}"></i>` : '', h ? '<i style="--c:var(--blue)"></i>' : '', open ? '<i style="--c:var(--text2)"></i>' : ''].join('');
      return `<button class="dtile drop ${d === sd ? 'sel' : ''} ${d === td ? 'today' : d < td ? 'past' : ''}" data-drop="${d}" data-act="sel-day" data-date="${d}" aria-label="${longDate(d)}">
        <span class="dw">${DOW[i]}</span><span class="dn">${parse(d).getDate()}</span><span class="dots">${dots}</span></button>`;
    }).join('')}</div>
    <div class="grid" id="dayDetail">${dayDetail(sd)}</div>`;
  }
  return hero(`Week ${weekNo(weekStart)}${isCurWeek() ? ' · this week' : ''}`, weekLabel(weekStart), `${fh(hrs)} hours · ${sDone}/${plan.length} sessions · ${left} open task${left === 1 ? '' : 's'}`, right) + body;
}

// The selected day's cards under the week row. Picking a day swaps only this, so the row never redraws or moves.
function dayDetail(sd) {
  const list = tasksOn(sd), sh = S.shifts[sd];
  return `<section class="card g7 anim" style="--i:2"><div class="ch"><h3>${rel(sd)}</h3><span class="sub">${longDate(sd)}</span></div>
      <ul class="tasks drop" data-drop="${sd}">${list.map(t => taskLi(t, sd)).join('') || '<li class="empty">Nothing planned.</li>'}</ul>${addForm(sd, 'Add a task')}</section>
    <div class="g5" style="display:flex;flex-direction:column;gap:16px">
      <section class="card anim" style="--i:3"><div class="ch"><h3>Shift</h3><span class="sub" data-total-for="${sd}">${shiftHours(sh) ? fh(shiftHours(sh)) + ' hours' : ''}</span></div>${shiftEditor(sd)}</section>
      <section class="card tilecard anim" style="--i:4">${sessionArt(sd, { small: true })}</section>
    </div>`;
}
function shiftEditor(d) {
  const s = S.shifts[d] || {}, pr = presets();
  return `<div class="shift-ed" data-date="${d}">
    <label>Start<input type="time" data-f="start" value="${esc(s.start || '')}"></label>
    <label>End<input type="time" data-f="end" value="${esc(s.end || '')}"></label>
    <label>Break (min)<input type="number" inputmode="numeric" data-f="brk" min="0" step="5" placeholder="0" value="${esc(s.brk ?? '')}"></label></div>
    ${pr.length ? `<div class="chips" style="margin-top:12px">${pr.map(p => presetChip(p, d)).join('')}</div>` : ''}
    ${shiftHours(s) ? `<button class="btn sm tint" style="--c:var(--red);margin-top:12px" data-act="clear-shift" data-date="${d}">Clear shift</button>` : ''}`;
}

function renderHours() {
  const dates = weekDates(), td = today(), hrs = weekHours(dates), rate = +S.settings.rate, goal = +S.settings.hoursGoal, pr = presets();
  const worked = dates.filter(d => shiftHours(S.shifts[d]) > 0).length;
  const rows = dates.map((d, i) => {
    const s = S.shifts[d] || {}, h = shiftHours(s);
    return `<div class="srow anim ${d === td ? 'today' : ''}" data-date="${d}" style="--i:${i + 2}">
      <div class="sd"><b>${DOW[i]}</b><span>${short(d)}${isCutoff(d) ? ' · hours due' : isPayday(d) ? ' · payday' : ''}</span></div>
      <div class="sin"><input type="time" data-f="start" value="${esc(s.start || '')}" aria-label="Start"><span class="to">–</span><input type="time" data-f="end" value="${esc(s.end || '')}" aria-label="End">
        <label class="bk"><input type="number" inputmode="numeric" data-f="brk" min="0" step="5" placeholder="0" value="${esc(s.brk ?? '')}" aria-label="Break minutes">min</label></div>
      <div class="sh" data-total-for="${d}">${h ? `${fh(h)}<small>h</small>` : '<span class="muted">—</span>'}</div>
      <div class="sx">${h ? `<button class="xbtn" data-act="clear-shift" data-date="${d}" aria-label="Clear">✕</button>` : pr.slice(0, 2).map(p => presetChip(p, d)).join('')}</div></div>`;
  }).join('');
  const weeks = [...Array(8)].map((_, i) => addDays(weekStart, -7 * (7 - i)));
  const vals = weeks.map(w => weekHours(datesOf(w))), top = Math.max(goal, ...vals, 1);

  const right = `<button class="btn tint" data-act="copy-last">Copy last week</button><button class="btn fill" data-act="copy-summary">Copy summary</button>${weekNav()}`;
  return hero(`Hours · ${weekLabel(weekStart)}`, `${nk('hh', hrs, 1)} hours`, [`${worked} day${worked === 1 ? '' : 's'} worked`, worked ? `avg ${fh(hrs / worked)}h a shift` : '', rate ? `≈ ${money(hrs * rate)}` : '', goal ? `${Math.round(hrs / goal * 100)}% of ${goal}h target` : ''].filter(Boolean).join(' · '), right) + `<div class="grid">
    <section class="card g8 anim" style="--i:1"><div class="ch"><h3>Shifts</h3><span class="sub">Type times or tap a usual shift</span></div>${rows}</section>

      <section class="card anim" style="--i:2">${payCard()}</section>
      <section class="card anim" style="--i:3">${clockCard(td)}</section>
      <section class="card anim" style="--i:4"><div class="ch"><h3>Last 8 weeks</h3><span class="sub">${avg ? `avg ${fh(Math.round(avg * 10) / 10)}h` : ''}</span></div>
        <div class="bars">${avg ? `<div class="avg" style="bottom:calc(${avg / top * 82}% + 27px)"><span>avg</span></div>` : ''}${weeks.map((w, i) => `<div class="bc ${i === 7 ? 'cur' : ''}"><div class="b" data-pk="bar-${iso(w)}" data-to="${vals[i] / top * .82}">${vals[i] ? `<span>${fh(vals[i])}</span>` : ''}</div><span class="bl">${short(iso(w)).replace(' ', ' ')}</span></div>`).join('')}</div></section>
    </div></div>`;
}

// The pay period covering whichever week you're looking at.
function payCard() {
  const p = periodFor(iso(weekStart)), td = today(), rate = +S.settings.rate;
  const hrs = periodHours(p), days = periodDates(p);
  const left = daysBetween(td, p.end), elapsed = days.filter(d => d <= td).length;
  const worked = days.filter(d => shiftHours(S.shifts[d]) > 0).length;
  const when = left < 0 ? `Closed ${short(p.end)}`
    : left === 0 ? `Last day for hours · paid ${DOW_LONG[dowIdx(p.payday)]}`
    : left === 1 ? `Hours due tomorrow · paid ${DOW_LONG[dowIdx(p.payday)]}`
    : `Hours due ${DOW_LONG[dowIdx(p.end)]} · ${left} days`;
  const half = days.slice(0, Math.floor(p.cyc / 2)), rest = days.slice(Math.floor(p.cyc / 2));
  const wk = (list, label) => `<div class="pw"><span>${label}</span><b>${fh(list.reduce((a, d) => a + shiftHours(S.shifts[d]), 0))}h</b></div>`;
  const ex = extraHours(p), total = hrs + ex;
  const sub = inSubmitWindow(p) ? pendingDays(p) : [], est = sub.reduce((a, x) => a + shiftHours(x.est), 0);
  return `<div class="ch"><h3>Pay period</h3><span class="sub">${short(p.start)} – ${short(p.end)}</span></div>
    <div class="sub" style="margin:-8px 0 10px">Paid ${DOW_LONG[dowIdx(p.payday)]} ${short(p.payday)}</div>
    <div class="big">${rate ? money(total * rate) : `${nk('ph', total, 1)}<small>h</small>`}</div>
    <div class="sub" style="margin-top:6px">${rate ? `${fh(total)} hours · ${money(rate)}/h` : 'Add your hourly rate in Settings to see pay'}</div>
    <div class="exrow"><span>${fh(hrs)}h worked <i>+</i></span><input type="number" inputmode="decimal" min="0" step="0.5" data-extra="${p.end}" value="${ex || ''}" placeholder="0" aria-label="Subscription hours"><span>h subscriptions</span></div>
    ${pbar('pp', p.cyc ? Math.min(elapsed, p.cyc) / p.cyc : 0, 'var(--teal)')}
    <div class="sub" style="margin-top:8px">${when} · ${worked} day${worked === 1 ? '' : 's'} worked</div>
    ${sub.length ? `<div class="submitbox">
      <div class="sb-head"><b>Send to Len ${submitDay(p) === td ? 'today' : rel(submitDay(p))}</b><span>${fh(total + est)} h total</span></div>
      <div class="sub">${fh(hrs)}h logged + ${fh(est)}h estimated${ex ? ' + ' + fh(ex) + 'h subscriptions' : ''}</div>
      <div class="sb-days">${sub.map(x => `<span>${DOW[dowIdx(x.date)]} ${fh(shiftHours(x.est))}h</span>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn sm white" data-act="copy-submit">Copy for Len</button><button class="btn sm tint" data-act="fill-estimates">Fill them in</button></div>
    </div>` : ''}
    <div class="pws">${wk(half, 'Week 1')}${wk(rest, 'Week 2')}</div>
    <div class="row" style="margin-top:14px"><button class="btn sm" data-act="copy-period">Copy period</button><button class="btn sm tint" data-act="goto-period">Open period</button></div>`;
}

function renderTraining() {

  const plan = dates.filter(d => wo(d).s !== 'REST'), sDone = plan.filter(d => wo(d).done).length;
  const src = PROGRAM ? `Program from Jackson-Workout-Plan · ${PROGRAM_LIVE ? 'synced ' + ago(PROGRAM_AT) : 'cached ' + ago(PROGRAM_AT)}` : 'Loading your program from Jackson-Workout-Plan…';

      <span class="code">${w.s === 'REST' ? 'Rest' : w.s}</span><div class="nm">${esc(sessName(w.s))}</div>${w.prog ? pbar('wt-' + d, w.prog.p) : ''}</div></button>`;
  }).join('');
  const bms = [['pushups', 'Pushups', 'reps'], ['plank', 'Plank', 'sec'], ['row', '1-arm row @10kg', 'reps']].map(([k, l, u]) => {
    const L = benchLogs(k), last = L[L.length - 1], pb = L.length ? Math.max(...L.map(x => x.reps)) : null;
    return `<div class="bm"><div class="k">${l}</div><div class="v">${last ? nk('bm-' + k, last.reps) : '—'}<small>${u}</small></div><div class="s">${pb !== null ? `PB ${pb}${last && last.reps === pb ? ' · new best' : ''}` : 'No logs yet'}</div>${spark(L.map(x => x.reps))}
      <form data-bench="${k}"><input type="number" inputmode="numeric" min="1" placeholder="${u}"><button class="btn sm tint" style="--c:var(--orange)">Log</button></form></div>`;
  }).join('');
  const cl = cardioLogs(), wkStart = mondayOf(new Date()).getTime(), wkC = cl.filter(l => l.ts >= wkStart);
  // heatmap + streak
  const start = addDays(mondayOf(new Date()), -7 * 15); let cells = '';
  for (let w = 0; w < 16; w++) for (let i = 0; i < 7; i++) {
    const d = iso(addDays(start, w * 7 + i)), x = wo(d);
    const cls = d > td || (d < S.since && !x.done) ? '' : x.done ? 'hit' : x.s === 'REST' ? 'rest' : 'miss';
    cells += `<i class="${cls} ${d === td ? 'now' : ''}" style="--c:${SESS[x.s].color}" title="${short(d)} · ${x.s === 'REST' ? 'Rest' : x.s + ' ' + sessName(x.s)}${x.done ? ' ✓' : ''}"></i>`;
  }

  const lib = ['D1', 'D2', 'D3', 'D4'].map((k, i) => `<button class="focusable anim" data-act="open-session" data-s="${k}" style="--i:${i + 12}"><div class="art" style="background:${SESS[k].art}"><span class="wm">${k}</span><span class="code">${k} · ${flatEx(k.toLowerCase()).length} exercises</span><div class="nm">${esc(sessName(k))}</div><div class="ds">${esc(sessSub(k))}</div></div></button>`).join('');
  return hero(src, `${nk('tr', sDone)} of ${plan.length} sessions`, `${weekLabel(weekStart)} · ${streak ? `${streak}-week streak of full weeks` : 'Finish every planned session to start a streak'}`, `<a class="btn" href="${esc(S.settings.workoutUrl)}" target="_blank" rel="noopener">Workout app ${I.link}</a>${weekNav()}`) + `

        <div class="nlist" style="margin-top:14px">${cl.slice(-3).reverse().map(l => `<div class="nitem" style="--c:var(--pink)"><div class="ni">${l.type[0]}</div><div class="nb"><b>${esc(l.type)} · ${l.min} min${l.dist ? ` · ${l.dist} km` : ''}</b><span>${rel(iso(new Date(l.ts)))}</span></div></div>`).join('')}</div></section>
      <section class="card g7 anim" style="--i:10"><div class="ch"><h3>Consistency</h3><span class="sub">Last 16 weeks</span></div>
        <div class="heatwrap"><div class="heatl"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span>S</span></div><div class="heat">${cells}</div></div></section>
      <details class="card g5 anim fold" style="--i:11"><summary><h3>Plan</h3><span class="sub">Weekly split &amp; program</span></summary>
        <div class="lbl" style="margin-top:16px">Weekly split</div>
        <div class="tpl">${DOW.map((n, i) => `<label>${n}<select data-act="set-tpl" data-i="${i}">${SESS_KEYS.map(k => `<option value="${k}" ${k === S.template[i] ? 'selected' : ''}>${k === 'REST' ? 'Rest' : k}</option>`).join('')}</select></label>`).join('')}</div>
        <div class="lbl">Program · tap a session to view it</div><div class="plib">${lib}</div></details>
    </div>`;
}
function spark(v) {
  if (v.length < 2) return '<svg></svg>';
  const s = v.slice(-10), mx = Math.max(...s), mn = Math.min(...s), rg = mx - mn || 1;
  const pts = s.map((x, i) => `${(i / (s.length - 1) * 100).toFixed(1)},${(26 - (x - mn) / rg * 22).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 28" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#ff9f0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
let cardioType = 'HIIT';
const cardioForm = d => `<form class="cardio-f" data-cdate="${d || ''}" style="margin-top:14px"><div class="cardio-types">${CARDIO_TYPES.map(t => `<button type="button" class="chip ${t === cardioType ? 'on' : ''}" style="--c:var(--pink);--on:#fff" data-act="cardio-type" data-v="${t}">${t}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px"><input type="number" inputmode="numeric" min="1" placeholder="Minutes" style="flex:1" name="min"><input type="number" inputmode="decimal" min="0" step="0.1" placeholder="km (opt.)" style="width:110px" name="dist"><button class="btn fill" style="--c:var(--pink)">Log</button></div></form>`;

function renderJobs() {

    <section class="card g12 anim" style="--i:1"><div class="ch"><h3>Log an application</h3><span class="sub">Paste a link and the company fills itself</span></div>

function openCompose(title, date) {

  openSheet('compose');
}
function composeStep(step, dir) {

  if (step > 2) return addDraft();
  DRAFT.step = Math.max(0, step); DRAFT.dir = dir || 'fwd';
  refreshSheet();
}
function addDraft() {
  const d = DRAFT; if (!d || !d.title.trim()) return closeSheet();
  const t = { id: uid(), created: Date.now(), title: d.title.trim(), cat: d.cat, date: d.date, done: false, repeat: null, doneOn: {}, remind: d.remind || null };
  S.tasks.push(t); FX.added = t.id; DRAFT = null; closeSheet();
  island.toast(`Added to ${rel(t.date)}${t.remind ? ' · ' + t12(t.remind) : ''}`, { icon: I.check, color: CATS[t.cat].color });

const WHENS = () => { const td = parse(today()); return [['today', 'Today', today()], ['tomorrow', 'Tomorrow', iso(addDays(td, 1))], ['weekend', 'Weekend', iso(addDays(td, (5 - dowIdx(today()) + 7) % 7))], ['nextweek', 'Next week', iso(addDays(mondayOf(td), 7))]]; };
const REMINDS = [['', 'No reminder'], ['08:00', 'Morning'], ['12:00', 'Noon'], ['17:00', '5:00'], ['20:00', 'Evening']];

const SHEETS = {

const VIEWS = { today: renderToday, week: renderWeek, hours: renderHours, training: renderTraining, jobs: renderJobs };

  root.querySelectorAll('details').forEach((el, i) => el.open && open.add(i));

// FLIP: remember where each task sat, then slide it from there to its new spot instead of jumping.
function flipFirst(root) {
  if (REDUCED) return null;
  const m = new Map();
  root.querySelectorAll('.task[data-id]').forEach(el => m.set(el.dataset.id + '|' + el.dataset.date, el.getBoundingClientRect().top));
  return m;
}
function flipPlay(root, m) {
  root.querySelectorAll('.task[data-id]').forEach(el => {
    const top0 = m.get(el.dataset.id + '|' + el.dataset.date); if (top0 === undefined) return;
    const dy = top0 - el.getBoundingClientRect().top; if (Math.abs(dy) < 2) return;
    el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });
}
// Horizontal rails (phone day strip, training tiles, narrow board) get rebuilt on every render,
// which resets their scroll. Restore it, then glide the selected day (or today) to the center.
function centerRails(root, kept) {
  root.querySelectorAll('.wtiles,.board').forEach(el => {
    if (el.scrollWidth <= el.clientWidth) return;
    const k = el.classList[0];
    if (k in kept) { el.scrollLeft = kept[k]; return; } // same screen redrawing: stay exactly where you were
    const today = el.querySelector('.today'), target = today && today.closest('.wtile,.col');
    if (target) el.scrollLeft = target.offsetLeft - (el.clientWidth - target.offsetWidth) / 2; // fresh open: today in view
  });
}
// Every tab opens at the top on the current week (or on the day a link points to).
// Tapping the tab you're already on scrolls back to the top, like iOS.
function switchTab(k, sel) {
  if (k === S.ui.tab && !sel) return scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
  weekStart = mondayOf(sel ? parse(sel) : new Date());

  S.ui.tab = k; FX.enter = 'enter'; FX.seg = true; save();
  scrollTo(0, 0);

}

function toggleTask(li) {

document.addEventListener('click', e => {
  if (e.target.closest('[data-il]')) { e.stopPropagation(); const fn = island.action; island.action = null; island.mode = null; clearTimeout(island.timer); fn && fn(); island.live(); return; }
  if (e.target.closest('#island') && !e.target.closest('[data-act]')) { if (island.key === 'clock' || island.key === 'break') switchTab('today'); return; }
  const el = e.target.closest('[data-act],[data-tab]'); if (!el) return;
  if (el.dataset.tab && !el.dataset.act) { closeSheet(); return switchTab(el.dataset.tab, el.dataset.sel); }
  const a = el.dataset.act, v = el.dataset.v;
  const task = () => SHEET && S.tasks.find(x => x.id === SHEET.arg.id);
  const job = () => SHEET && S.jobs.find(x => x.id === SHEET.arg);
  switch (a) {
    case 'prev': return shiftWeek(-1);
    case 'next': return shiftWeek(1);
    case 'thisweek': return shiftWeek(0);
    case 'toggle-task': return toggleTask(el.closest('.task'));
    case 'task-menu': { const li = el.closest('.task'); return openSheet('task', { id: li.dataset.id, d: li.dataset.date || null }); }
    case 'tm-when': { const t = task(), td = parse(today()); t.date = { today: today(), tomorrow: iso(addDays(td, 1)), weekend: iso(addDays(td, (5 - dowIdx(today()) + 7) % 7)), nextweek: iso(addDays(mondayOf(td), 7)) }[v]; if (t.repeat && t.repeat.t === 'weekly') t.repeat.dow = dowIdx(t.date); save(); return refreshSheet(); }
    case 'tm-cat': task().cat = v; save(); return refreshSheet();
    case 'tm-rep': { const t = task(); t.repeat = v === 'none' ? null : { t: v, dow: dowIdx(t.date || today()) }; if (t.repeat && !t.date) t.date = today(); t.doneOn = t.doneOn || {}; save(); return refreshSheet(); }
    case 'tm-del': { const t = task(); closeSheet(); const li = $(`.task[data-id="${t.id}"]`); return collapse(li).then(() => withUndo('Task deleted', () => { S.tasks = S.tasks.filter(x => x !== t); })); }
    case 'rollover': { const td = today(); return withUndo(`Moved ${overdue().length} to today`, () => overdue().forEach(t => t.date = td)); }
    case 'clock-in': S.clock = { date: today(), startTs: Date.now(), brkMs: 0, breakTs: null }; haptic(15); commit(); return island.toast('Clocked in', { icon: I.play, color: '#30d158' });
    case 'clock-break': { const c = S.clock; if (c.breakTs) { c.brkMs += Date.now() - c.breakTs; c.breakTs = null; } else c.breakTs = Date.now(); island.key = null; return commit(); }
    case 'clock-out': return clockOut();
    case 'apply-preset': { const [start, end, brk] = el.dataset.p.split('|'), d = el.dataset.date; S.shifts[d] = { ...(S.shifts[d] || {}), start, end, brk: +brk }; haptic(); commit(); if (SHEET) refreshSheet(); return island.toast(`${rel(d)} · ${fh(shiftHours(S.shifts[d]))}h logged`, { icon: I.hours, color: '#64d2ff' }); }
    case 'clear-shift': { const d = el.dataset.date; withUndo(`${rel(d)} shift cleared`, () => delete S.shifts[d]); return SHEET && refreshSheet(); }
    case 'open-shift': return openSheet('shift', el.dataset.date);

    case 'sess-pick': { const d = SHEET.arg.d, o = S.workouts[d] || {}; S.workouts[d] = { ...o, s: v, done: v === 'REST' ? false : o.done, auto: false }; save(); return refreshSheet(); }
