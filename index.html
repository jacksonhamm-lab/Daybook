<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Daybook</title>
<meta name="description" content="Work hours, tasks, training and job applications in one place.">
<meta name="theme-color" content="#05060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module" src="rider.js"></script>
<style>
@property --glow{syntax:'<color>';inherits:true;initial-value:#0a84ff}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{
  --bg:#05060a;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --fill:rgba(118,118,128,.22);
  --stroke:rgba(255,255,255,.085); --stroke2:rgba(255,255,255,.16); --sep:rgba(255,255,255,.07);
  --text:#f5f5f7; --text2:rgba(235,235,245,.62); --text3:rgba(235,235,245,.34);
  --blue:#0a84ff; --indigo:#5e5ce6; --teal:#64d2ff; --green:#30d158; --orange:#ff9f0a; --yellow:#ffd60a; --red:#ff453a; --pink:#ff375f; --purple:#bf5af2; --gray:#8e8e93;
  --spring:cubic-bezier(.34,1.56,.64,1); --ios:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.2,.8,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;
  --glow:#0a84ff; transition:--glow .9s ease;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:15px/1.4 var(--font);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
html,body,button,a,input,select,textarea,label,[data-act],[data-tab]{touch-action:manipulation}
button,.set,.chip,.pill,.mini,.dtile,.wtile,.jrow,.nitem,.ck,.tb,.eb{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{cursor:default}
a{color:inherit}
input,select,textarea{background:var(--fill);border:1px solid transparent;border-radius:11px;padding:9px 12px;outline:none;min-width:0;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:color-mix(in srgb,var(--glow) 80%,transparent);background:rgba(118,118,128,.3)}
input::placeholder,textarea::placeholder{color:var(--text3)}
input[type=time],input[type=date],select{color-scheme:dark}
input[type=number]{-moz-appearance:textfield}
::selection{background:color-mix(in srgb,var(--glow) 55%,transparent)}
.num,.tab-num{font-variant-numeric:tabular-nums}

/* ambient PS5-style backdrop */
#boot{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 45%,#0b1626 0%,#05060a 70%);opacity:1;transition:opacity .45s ease}
#boot.gone{opacity:0;pointer-events:none}
.boot-core{position:relative;display:grid;place-items:center;text-align:center}
.boot-rings{width:min(46vw,210px);height:min(46vw,210px);fill:none}
.br{stroke-linecap:round;transform-origin:100px 100px;stroke-width:3}
.b1{stroke:#0a84ff;stroke-dasharray:503;stroke-dashoffset:503;animation:draw .85s var(--ios) forwards,spin 7s linear infinite}
.b2{stroke:#ff9f0a;stroke-dasharray:364;stroke-dashoffset:364;animation:draw .85s var(--ios) .12s forwards,spin 5s linear infinite reverse}
.b3{stroke:#30d158;stroke-dasharray:226;stroke-dashoffset:226;animation:draw .85s var(--ios) .24s forwards,spin 4s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-word{position:absolute;font-size:clamp(20px,5vw,26px);font-weight:800;letter-spacing:.34em;text-indent:.34em;opacity:0;animation:bootWord .7s var(--ios) .35s forwards}
@keyframes bootWord{from{opacity:0;filter:blur(8px);transform:scale(.92)}to{opacity:1;filter:none;transform:none}}
.boot-line{position:absolute;bottom:-46px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);opacity:0;animation:fadeUp .5s ease .75s forwards;white-space:nowrap}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:.9;transform:none}}
/* Fades in and out as it crosses, so it can't snap back when the run ends. */
.boot-sweep{position:absolute;inset:-25%;pointer-events:none;background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.10) 50%,transparent 62%);transform:translate3d(-75%,0,0);opacity:0;will-change:transform,opacity;backface-visibility:hidden;animation:sweep 1.3s cubic-bezier(.4,0,.2,1) .25s forwards}
@keyframes sweep{0%{transform:translate3d(-75%,0,0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translate3d(75%,0,0);opacity:0}}
@media (prefers-reduced-motion:reduce){#boot{display:none}}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient::before{content:"";position:absolute;inset:-20%;background:
  radial-gradient(40% 35% at 18% 8%,color-mix(in srgb,var(--glow) 42%,transparent),transparent 70%),
  radial-gradient(35% 30% at 88% 4%,color-mix(in srgb,var(--glow) 20%,transparent),transparent 70%),
  radial-gradient(60% 45% at 60% 110%,rgba(46,58,110,.45),transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
.ambient::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0,rgba(5,6,10,.4) 60%,var(--bg) 100%)}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-4%,3%,0) scale(1.08)}}

/* top bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:calc(12px + env(safe-area-inset-top)) 28px 12px;background:rgba(5,6,10,.5);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--sep)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.025em}
.brand img{width:30px;height:30px;border-radius:8px}
.top .sp{flex:1}
.kbd{font-size:11px;color:var(--text3);border:1px solid var(--stroke2);border-radius:6px;padding:1px 6px;margin-left:4px}
.lvl{position:relative;width:38px;height:38px;display:grid;place-items:center;flex:none}
.lvl svg{position:absolute;inset:0;width:38px;height:38px;fill:none}
.lvl .lv-t{stroke:rgba(255,255,255,.14);stroke-width:3}
.lvl .lv-p{stroke:var(--yellow);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(255,214,10,.6));transition:stroke-dashoffset .8s var(--ease)}
.lvl b{font-size:14px;font-weight:800;letter-spacing:-.02em}
.lvl:hover{transform:scale(1.06)}
.lvl-head{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.lvl-big{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:800;background:linear-gradient(140deg,#3d2f00,#c79a00 60%,#fff08a);color:#231a00}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sg{padding:12px;border-radius:14px;background:rgba(255,255,255,.04)}
.sg b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em}
.sg span{font-size:11.5px;color:var(--text2)}
.troph{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.tr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.03);opacity:.45}
.tr.got{opacity:1;background:color-mix(in srgb,var(--yellow) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--yellow) 25%,transparent)}
.tr-i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--text3)}
.tr.got .tr-i{background:color-mix(in srgb,var(--yellow) 22%,transparent);color:var(--yellow)}
.tr b{display:block;font-size:14px}
.tr span{font-size:12px;color:var(--text2)}
.rail{display:contents}
.quests-card .ch{margin-bottom:10px}
@media(max-width:760px){
  #v-today .grid{display:flex;flex-direction:column}
  #v-today .slip-card{order:1}
  #v-today .quests-card{order:2}
  #v-today .tasks-card{order:3}
  #v-today .rail{order:4}
  #v-today .next-card{order:5}
  #v-today .hero{padding:16px 0 12px}
  #v-today .hero h1{font-size:30px}
  #v-today .hero p{font-size:14px;margin-top:6px}
  .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail>section{flex:0 0 86%;scroll-snap-align:center;margin:0}
  .rail .rings{width:130px}
  .rail .art{min-height:200px}
}
.bk-head{margin:6px 0 12px}
.rcp{border-radius:18px;background:rgba(255,255,255,.035);margin-bottom:8px;overflow:hidden}
.rcp.open{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--stroke)}
.rcp-h{display:flex;align-items:stretch}
.rcp-pick{flex:none;width:54px;display:grid;place-items:center}
.rcp-pick i{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;transition:background .25s,border-color .25s,transform .3s var(--spring)}
.rcp-pick i svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s var(--ease)}
.rcp-pick.on i{background:var(--green);border-color:var(--green)}
.rcp-pick.on i svg{stroke-dashoffset:0}
.rcp-pick:active i{transform:scale(.88)}
.rcp-t{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:14px 14px 14px 0;text-align:left}
.rcp-g{font-size:13px;font-weight:700;color:var(--text);margin:12px 0 4px}
.rcp-h b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}
.rcp-h span{font-size:13px;color:var(--text2)}
.rcp-p{margin-left:auto;text-align:right;flex:none}
.rcp-p b{font-size:22px;color:var(--green);letter-spacing:-.03em}
.rcp-p span{display:block;font-size:11px;color:var(--text3)}
.rcp-b{padding:0 14px 16px;animation:cardIn .4s var(--ios) both}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.macros div{padding:8px;border-radius:12px;background:rgba(255,255,255,.05);text-align:center}
.macros b{display:block;font-size:16px;font-weight:700}
.macros span{font-size:10.5px;color:var(--text2)}
.rcp-meta{color:var(--text2);font-size:13px;margin:0 0 6px}
.rcp-i{margin:0;padding-left:18px;font-size:14px;color:var(--text2)}
.rcp-i li{margin-bottom:4px}
.rcp-s{counter-reset:st;list-style:none;margin:0;padding:0}
.rcp-s li{counter-increment:st;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep);font-size:14px;color:var(--text2)}
.rcp-s li::before{content:counter(st);font-size:18px;font-weight:800;color:var(--green);line-height:1.2}
.rcp-s b{display:block;color:var(--text);margin-bottom:2px}
.gitem{display:flex;width:100%;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid var(--sep);text-align:left}
.gitem .g-box{width:22px;height:22px;flex:none;margin-top:1px;border-radius:7px;border:2px solid rgba(255,255,255,.22);display:grid;place-items:center}
.gitem .g-box svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s var(--ease)}
.gitem.done .g-box{background:var(--green);border-color:var(--green)}
.gitem.done .g-box svg{stroke-dashoffset:0}
.gitem .g-n{font-size:15px}
.gitem .g-n em{display:block;font-style:normal;font-size:12.5px;color:var(--text3)}
.gitem.done .g-n{color:var(--text3);text-decoration:line-through}
.snkfold{margin-top:18px}
.snk .snk-p{margin-left:auto;flex:none;align-self:center;font-size:13px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.snk.done .snk-p{opacity:.5}
.snk.done .g-n{color:var(--text);text-decoration:none}
.snk.done .g-n em{color:var(--text3);text-decoration:none}
.shakes{display:flex;gap:10px;flex-wrap:wrap}
.shake{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:rgba(255,255,255,.04);font-size:15px;font-weight:600;text-align:left;transition:background .25s,transform .3s var(--spring)}
.shake:active{transform:scale(.97)}
.shake .sk-box{width:26px;height:26px;flex:none;border-radius:9px;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;transition:background .25s,border-color .25s}
.shake .sk-box svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .35s var(--ease) .05s}
.shake.on{background:color-mix(in srgb,var(--green) 16%,transparent)}
.shake.on .sk-box{background:var(--green);border-color:var(--green)}
.shake.on .sk-box svg{stroke-dashoffset:0}
.quests{display:flex;flex-direction:column;gap:10px}
.qt{display:flex;align-items:center;gap:12px}
.qt .qt-b{flex:1;min-width:0}
.qt .qt-l{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.qt .qt-l span{color:var(--text2);font-weight:500}
.qt.done .qt-l{color:var(--text3);text-decoration:line-through}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--glow),#1c1c22);display:grid;place-items:center;font-weight:700;font-size:14px;transition:transform .3s var(--spring)}
.avatar:hover{transform:scale(1.08)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:background .3s,box-shadow .3s}
.sync-dot.off{display:none}
.sync-dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.sync-dot.err{background:var(--red);box-shadow:0 0 8px var(--red)}
.sync-dot.syncing{background:var(--teal);animation:pulseDot 1.2s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}

/* segmented control */
.seg{position:relative;display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;isolation:isolate}
.seg>button{position:relative;z-index:1;padding:7px 15px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap;transition:color .25s}
.seg>button.on{color:var(--text)}
.seg>button:hover{color:var(--text)}
.seg .ind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:rgba(255,255,255,.16);box-shadow:0 3px 10px rgba(0,0,0,.3),inset 0 0 0 .5px rgba(255,255,255,.1);transition:left .5s var(--spring),width .5s var(--spring)}
.seg.noanim .ind{transition:none}
.seg b{font-weight:600;color:var(--text3);margin-left:5px}

/* bottom tab bar (mobile) */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(18,18,22,.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--sep)}
.tb-ind{position:absolute;top:4px;height:calc(100% - 10px - env(safe-area-inset-bottom));border-radius:16px;background:color-mix(in srgb,var(--glow) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--glow) 25%,transparent);transition:left .45s var(--spring),width .45s var(--spring);pointer-events:none}
.tabbar button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:10px;font-weight:600;color:var(--text3);transition:color .25s}
.tabbar button svg{width:25px;height:25px;transition:transform .4s var(--spring)}
.tabbar button.on{color:var(--glow)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.08)}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{display:none;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:41;width:56px;height:56px;border-radius:50%;background:#fff;color:#000;box-shadow:0 12px 30px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.06);place-items:center;transition:transform .35s var(--spring)}
.fab:active{transform:scale(.9)}
.fab svg{width:26px;height:26px}

/* layout */
.main{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 28px 120px}
.view{display:none}.view.on{display:block}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:40px 0 26px}
.kicker{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb,var(--glow) 75%,#fff)}
.hero h1{margin:6px 0 0;font-size:clamp(34px,5vw,58px);line-height:1.02;font-weight:800;letter-spacing:-.04em}
.hero p{margin:10px 0 0;font-size:17px;color:var(--text2);max-width:60ch}
.hero-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wnav{display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.g3{grid-column:span 3}.g4{grid-column:span 4}.g5{grid-column:span 5}.g6{grid-column:span 6}.g7{grid-column:span 7}.g8{grid-column:span 8}.g12{grid-column:1/-1}
@media(max-width:1100px){.g3,.g4,.g5,.g6,.g7,.g8{grid-column:span 6}.gm12{grid-column:1/-1}}
@media(max-width:760px){
  .grid>*{grid-column:1/-1!important}
  .main{padding:0 16px calc(110px + env(safe-area-inset-bottom))}
  .top{padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .top .nav,.top .qa-btn{display:none}
  .tabbar{display:flex}.fab{display:grid}
  .hero{padding:22px 0 18px}
  .hero p{font-size:15px}
  .hero-r{width:100%}
  .wnav{margin-left:auto}
}

/* cards */
.card{position:relative;background:var(--glass);border:1px solid var(--stroke);border-radius:26px;padding:22px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -30px rgba(0,0,0,.8)}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.ch h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.025em}
.sub{color:var(--text2);font-size:13px}
.muted{color:var(--text3)}
.lbl{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:22px}
.row.fill>*{flex:1}
.empty{color:var(--text3);font-size:14px;padding:22px 4px;text-align:center;animation:cardIn .6s var(--ios) both}
.empty b{display:block;color:var(--text2);font-size:15px;margin-bottom:3px}

/* enter animations */
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.975)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
.enter .anim{animation:cardIn .75s var(--ios) both;animation-delay:calc(var(--i,0)*60ms)}
.enter-l .anim{animation:inL .55s var(--ios) both;animation-delay:calc(var(--i,0)*28ms)}
.enter-r .anim{animation:inR .55s var(--ios) both;animation-delay:calc(var(--i,0)*28ms)}

/* buttons & chips */
.btn{height:38px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;background:var(--glass2);border:1px solid var(--stroke);white-space:nowrap;transition:transform .3s var(--spring),background .2s,box-shadow .3s;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.15)}
.btn:active{transform:scale(.95)}
.btn.icon{width:38px;padding:0;font-size:20px}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.lg{height:54px;padding:0 26px;font-size:17px}
.btn.fill{background:var(--c,var(--blue));border-color:transparent;color:#fff}
.btn.fill:hover{filter:brightness(1.1)}
.btn.tint{background:color-mix(in srgb,var(--c,var(--blue)) 18%,transparent);border-color:transparent;color:color-mix(in srgb,var(--c,var(--blue)) 85%,#fff)}
.btn.tint:hover{background:color-mix(in srgb,var(--c,var(--blue)) 28%,transparent)}
.btn.white{background:#fff;color:#000;border-color:#fff}
.btn.white:hover{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.2)}
.btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;white-space:nowrap;flex:none;border-radius:999px;display:inline-flex;align-items:center;gap:7px;background:var(--fill);font-size:13px;font-weight:600;color:var(--text);transition:transform .3s var(--spring),background .2s,color .2s}
.chip:hover{background:rgba(118,118,128,.34)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--c,#f5f5f7);color:var(--on,#000)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on .dot{background:#fff}
.chip-date{height:34px;padding:0 10px;border-radius:999px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 85%,#fff);white-space:nowrap}
.pbar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.pbar i{position:relative;display:block;height:100%;width:calc(var(--p)*100%);border-radius:3px;background:var(--c,var(--glow));transition:--p 1.1s var(--ease);overflow:hidden}
.pbar.live i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-100%);animation:barShine 2.6s var(--ease) infinite}
.pbar.full i{box-shadow:0 0 10px -1px var(--c,var(--glow))}
@keyframes barShine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(200%)}}

/* rings */
.rings-wrap{display:flex;align-items:center;gap:26px}
.rings{width:min(190px,42vw);height:auto;aspect-ratio:1;flex:none;filter:drop-shadow(0 8px 24px rgba(0,0,0,.45))}
.ring{fill:none;stroke-linecap:round;stroke-dasharray:calc(var(--C)*1px);stroke-dashoffset:calc(var(--C)*(1 - var(--p))*1px);transition:--p 1.5s var(--ease)}
.ring-t{fill:none}
@media(max-width:480px){.rings-wrap{gap:16px}.lgd .v{font-size:22px!important}.lgd .v small{font-size:13px!important}.legend{gap:10px!important}}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.lgd{display:flex;flex-direction:column;cursor:pointer;border-radius:12px;padding:2px 0;transition:transform .3s var(--spring)}
.lgd:hover{transform:translateX(3px)}
.lgd .k{font-size:13px;font-weight:600;color:var(--c)}
.lgd .v{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.lgd .v small{font-size:15px;color:var(--text2);font-weight:600;margin-left:3px}

/* clock */
.timer{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0 6px}
.timer small{font-size:22px;color:var(--text2);margin-left:4px}
.live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,69,58,.6);animation:pulse 1.8s infinite}
.live-dot.brk{background:var(--orange);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,69,58,.55)}70%{box-shadow:0 0 0 12px rgba(255,69,58,0)}100%{box-shadow:0 0 0 0 rgba(255,69,58,0)}}
.clockin{width:100%;margin-top:4px;--c:var(--blue);box-shadow:0 10px 30px -8px color-mix(in srgb,var(--blue) 70%,transparent)}
.clockin svg{width:20px;height:20px}

/* session art tiles */
.tilecard{padding:0;overflow:hidden}
.art{position:relative;min-height:250px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;color:#fff;overflow:hidden;border-radius:inherit;isolation:isolate}
.art::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.28),transparent 45%),linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}
.art::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transform:translateX(-100%);transition:transform 1.1s var(--ease)}
@media(hover:hover){.art:hover::after{transform:translateX(100%)}}
.wm{position:absolute;z-index:-1;right:-6px;top:-34px;font-size:170px;font-weight:800;letter-spacing:-.07em;opacity:.16;line-height:1}
.art .code{font-size:13px;font-weight:700;letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.art .nm{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.art .ds{font-size:15px;opacity:.85}
.art .pbar{background:rgba(255,255,255,.25);margin:12px 0 4px}
.art .pbar i{background:#fff}
.art .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.art .foot .sub{color:rgba(255,255,255,.8)}
.badge{position:absolute;top:18px;right:18px;display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);font-size:12px;font-weight:700}

/* PS5 focus ring */
.focusable{transition:transform .5s var(--spring),box-shadow .35s ease,background .25s}
.focusable.sel{transform:scale(1.035);box-shadow:0 0 0 2.5px #fff,0 0 30px 2px rgba(255,255,255,.22),0 24px 50px -16px rgba(0,0,0,.9);z-index:2}
@media(hover:hover){.focusable:hover{transform:scale(1.035);box-shadow:0 0 0 2.5px #fff,0 0 30px 2px rgba(255,255,255,.22),0 24px 50px -16px rgba(0,0,0,.9);z-index:2}}
@media(hover:hover){.focusable:active{transform:scale(1.01)}}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;min-height:40px;border-radius:14px;transition:background .2s,box-shadow .2s}
.task{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;position:relative;transition:background .2s}
.task+.task{box-shadow:0 -1px 0 var(--sep)}
.task:hover{background:rgba(255,255,255,.045)}
.task[draggable=true]{cursor:grab}
.task.dragging{opacity:.35}
.ck{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 75%,transparent);display:grid;place-items:center;transition:background .25s,border-color .25s,transform .45s var(--spring)}
.ck{position:relative}.ck::after{content:"";position:absolute;inset:-10px;border-radius:50%}
.ck:hover{background:color-mix(in srgb,var(--c) 20%,transparent)}
.ck svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .35s var(--ease) .08s}
.task.done .ck{background:var(--c);border-color:var(--c)}
.task.done .ck svg{stroke-dashoffset:0}
.tb{flex:1;min-width:0;cursor:pointer}
.tt{font-size:15px;overflow-wrap:anywhere;transition:color .3s,opacity .3s}
.task.done .tt{color:var(--text3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.28)}
.tm{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:12px;color:var(--text3)}
.tm .cd{width:7px;height:7px;border-radius:50%;background:var(--c)}
.tm svg{width:12px;height:12px}
.fx-in{animation:taskIn .55s var(--spring) both}
@keyframes taskIn{from{opacity:0;transform:translateY(-10px) scale(.95)}}
.pop{animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.drop.over{background:color-mix(in srgb,var(--glow) 13%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--glow) 65%,transparent)}
.qadd{display:flex;align-items:center;gap:10px;margin-top:8px;padding:4px 8px;border-radius:12px;transition:background .2s}
.qadd:focus-within{background:rgba(255,255,255,.05)}
.qadd .plus{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--glow) 22%,transparent);color:color-mix(in srgb,var(--glow) 80%,#fff);font-size:18px;font-weight:600}
.qadd input{flex:1;background:none;border:0;padding:8px 0;font-size:15px}
.qadd input:focus{background:none}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--red) 12%,transparent);color:color-mix(in srgb,var(--red) 80%,#fff);font-size:14px;font-weight:600;margin-bottom:8px}

/* next up */
.nlist{display:flex;flex-direction:column;gap:6px}
.nitem{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:rgba(255,255,255,.035);transition:background .2s,transform .35s var(--spring)}
.nitem:hover{background:rgba(255,255,255,.06)}
.nitem .ni{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 85%,#fff)}
.nitem .ni svg{width:20px;height:20px}
.nitem .nb{flex:1;min-width:0}
.nitem b{display:block;font-size:14px;font-weight:600}
.nitem span{font-size:13px;color:var(--text2)}

/* week */
.strip,.wtiles,.board{position:relative}
/* Week row (phones/tablets): all 7 days always fit, like the iOS Calendar week bar. No sideways scrolling. */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:16px;padding:6px;border-radius:24px;background:var(--glass);border:1px solid var(--stroke)}
.dtile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 10px;border-radius:18px;transition:background .25s}
.dtile .dw{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.dtile .dn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .25s,color .25s,transform .4s var(--spring)}
.dtile.past .dn{color:var(--text3)}
.dtile.today .dn,.dtile.today .dw{color:var(--red)}
.dtile.sel .dn{background:#fff;color:#000}
.dtile.sel.today .dn{background:var(--red);color:#fff}
.dtile:active .dn{transform:scale(.88)}
.dtile .dots{display:flex;gap:3px;height:6px}
.dtile .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.dtile .dots i.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.dnum{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1.15;width:max-content}
.dnum.today{background:var(--red);color:#fff;border-radius:999px;padding:0 10px;margin-left:-4px}
@keyframes swapIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.swap{animation:swapIn .35s var(--ios) both}
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:1180px){.board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.board .col{flex:0 0 250px;scroll-snap-align:start}}
.col{padding:14px 12px 10px;border-radius:22px;min-height:330px;display:flex;flex-direction:column}
.col.today{border-color:rgba(255,69,58,.4);box-shadow:0 0 0 1px rgba(255,69,58,.25),0 20px 50px -30px rgba(255,69,58,.5)}
.col-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 10px}
.col-h .dw{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.col .dnum{font-size:24px}
.col .tasks{flex:1;margin:4px -4px 0;padding:2px}
.col .task{padding:8px 4px;gap:9px}
.col .tt{font-size:13.5px}
.col .ck{width:20px;height:20px}
.col .ck svg{width:12px;height:12px}
.col .qadd{margin:4px -4px 0;padding:2px 4px}
.col .qadd input{font-size:13.5px}
.col .qadd .plus{width:20px;height:20px;font-size:15px}
.mini{display:flex;align-items:center;gap:7px;width:100%;margin-bottom:6px;padding:7px 10px;border-radius:11px;font-size:12px;font-weight:600;text-align:left;background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 80%,#fff);transition:background .2s,transform .3s var(--spring);position:relative;overflow:hidden}
.mini:hover{background:color-mix(in srgb,var(--c) 26%,transparent)}
.mini:active{transform:scale(.97)}
.mini.ghost{--c:#8e8e93;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:var(--text3)}
.mini.ghost:hover{color:var(--text)}
.mini .mb{position:absolute;left:0;bottom:0;height:2px;width:calc(var(--p)*100%);background:var(--c);transition:--p 1s var(--ease)}
.mini .ok{margin-left:auto}

/* hours */
.srow{display:grid;grid-template-columns:90px minmax(0,1fr) 84px 200px;align-items:center;gap:14px;padding:12px 8px;border-radius:16px;transition:background .2s}
.srow+.srow{box-shadow:0 -1px 0 var(--sep)}
.srow{transition:background .2s,transform .25s var(--spring)}
.srow:active{transform:scale(.995)}
.srow.today{box-shadow:inset 2px 0 0 var(--red)}
.srow:hover{background:rgba(255,255,255,.035)}
.srow.today .sd b{color:var(--red)}
.sd b{display:block;font-size:17px;font-weight:700}
.sd span{font-size:12px;color:var(--text3)}
.sin{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sin input[type=time]{width:122px;font-variant-numeric:tabular-nums}
.sin .to{color:var(--text3)}
.bk{display:flex;align-items:center;gap:6px;color:var(--text3);font-size:13px}
.bk input{width:62px;text-align:center}
.sh{font-size:22px;font-weight:700;letter-spacing:-.03em;text-align:right;font-variant-numeric:tabular-nums}
.sh small{font-size:13px;color:var(--text2);margin-left:2px}
.sx{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.sx .chip{height:30px;padding:0 11px;font-size:12px}
.xbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text3);transition:background .2s,color .2s}
.xbtn:hover{background:var(--fill);color:var(--text)}
@media(max-width:760px){.srow{grid-template-columns:1fr auto;row-gap:10px}.sin{grid-column:1/-1;order:3}.sx{grid-column:1/-1;order:4;justify-content:flex-start}.sh{order:2}}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;position:relative;margin-top:26px}
.bars .bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.bars .bc{animation:cardIn .6s var(--ios) both;animation-delay:calc(var(--i,0)*45ms)}
.bars .b{width:100%;max-width:38px;border-radius:9px 9px 5px 5px;background:color-mix(in srgb,var(--teal) 32%,transparent);height:calc(var(--p)*100%);min-height:4px;transition:--p 1.1s var(--ease);position:relative}
.bars .bc.cur .b{background:linear-gradient(180deg,var(--teal),var(--blue));box-shadow:0 0 24px -4px var(--teal)}
.bars .b span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap}
.bars .bl{font-size:11px;color:var(--text3);font-weight:600}
.avg{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(255,255,255,.25);pointer-events:none}
.avg span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--text3)}
.exrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--text2)}
.exrow i{font-style:normal;color:var(--text3)}
.exrow input{width:64px;padding:6px 8px;text-align:center;font-size:14px}
.submitbox{margin-top:14px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--teal) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--teal) 25%,transparent)}
.sb-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.sb-head b{font-size:15px}
.sb-head span{font-size:15px;font-weight:700;color:color-mix(in srgb,var(--teal) 85%,#fff)}
.sb-days{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sb-days span{padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12px;font-weight:600}
.pws{display:flex;gap:10px;margin-top:14px}
.pw{flex:1;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04)}
.pw span{display:block;font-size:12px;color:var(--text2);font-weight:600}
.pw b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.big small{font-size:18px;color:var(--text2);font-weight:600;margin-left:4px}
.shift-ed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.shift-ed label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text2);font-weight:600;min-width:0}
.shift-ed input{width:100%;font-size:17px;padding:11px 12px}
@media(max-width:480px){.shift-ed{grid-template-columns:repeat(2,minmax(0,1fr))}.shift-ed label:last-child{grid-column:1/-1}}
.art .foot>*{min-width:0}

/* training */
.wtiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.wtile{border-radius:22px;overflow:hidden;text-align:left;position:relative}
.wtile .art{min-height:180px;padding:14px}
.wtile .wm{font-size:110px;top:-20px}
.wtile .nm{font-size:17px}
.wtile .code{font-size:11px}
.wtile .dnum{font-size:13px;font-weight:700;position:absolute;top:12px;left:14px;opacity:.9}
.wtile .dnum.today{padding:1px 8px;margin:0}
.wtile .badge{top:10px;right:10px;padding:3px 8px;font-size:11px}
@media(max-width:900px){.wtiles{display:flex;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:6px 16px 12px;scrollbar-width:none}.wtiles::-webkit-scrollbar{display:none}.wtile{flex:0 0 150px;scroll-snap-align:start}}
.bms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.bms{grid-template-columns:1fr}}
.bm{padding:14px;border-radius:18px;background:rgba(255,255,255,.04)}
.bm .k{font-size:13px;font-weight:600;color:var(--text2)}
.bm .v{font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1.15}
.bm .v small{font-size:13px;color:var(--text3);margin-left:3px;font-weight:600}
.bm .s{font-size:12px;color:var(--text3)}
.bm svg{width:100%;height:30px;margin-top:6px;overflow:visible}
.spark-line{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.1s var(--ease) .15s forwards}
.bm form{display:flex;gap:6px;margin-top:10px}
.bm form input{flex:1;width:0;padding:7px 10px;font-size:13px}
@keyframes cellIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.heat i.rest{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.heat i.miss{background:color-mix(in srgb,var(--red) 30%,transparent)}
.heat i.hit{background:var(--c);box-shadow:0 0 8px -1px var(--c)}
.heat i.now{outline:2px solid #fff;outline-offset:1px}
.tpl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media(max-width:620px){.tpl{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tpl label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--text2)}
.tpl select{padding:8px;font-size:13px}
.plib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plib button{border-radius:18px;overflow:hidden;text-align:left}
.plib .art{min-height:130px;padding:14px}
.plib .nm{font-size:17px}
.plib .wm{font-size:110px;top:-20px}
.fold summary{list-style:none;display:flex;align-items:baseline;gap:12px;cursor:pointer}
.fold summary::-webkit-details-marker{display:none}
.fold summary h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.025em}
.fold summary::after{content:"\203A";margin-left:auto;font-size:26px;line-height:1;color:var(--text3);transition:transform .35s var(--spring)}
.fold[open] summary::after{transform:rotate(90deg)}
.cardio-types{display:flex;gap:6px;flex-wrap:wrap}

/* jobs */
.jadd{display:grid;grid-template-columns:1.4fr 1fr 1fr auto auto;gap:10px;align-items:center}
@media(max-width:1000px){.jadd{grid-template-columns:1fr 1fr}.jadd .jl{grid-column:1/-1}}
.jrow{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:16px;cursor:pointer;transition:background .2s,transform .35s var(--spring)}
.jrow+.jrow{box-shadow:0 -1px 0 var(--sep)}
.jrow:hover{background:rgba(255,255,255,.05)}
.jrow:active{transform:scale(.99)}
.jrow .jav{box-shadow:0 6px 18px -8px hsl(var(--h) 70% 45%)}
.jav{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 45%),hsl(calc(var(--h) + 40) 70% 30%))}
.jb{flex:1;min-width:0}
.jb b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jb span{font-size:13px;color:var(--text2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr{display:flex;align-items:center;gap:8px;flex:none}
.jr a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--text2);text-decoration:none;transition:background .2s}
.jr a:hover{background:var(--fill);color:var(--text)}
.pipes{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pipe{padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.04);min-width:92px}
.pipe b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;color:color-mix(in srgb,var(--c) 85%,#fff)}
.pipe span{font-size:12px;color:var(--text2);font-weight:600}
.segwrap{overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.segwrap::-webkit-scrollbar{display:none}

/* sheets */
.ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s ease}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:71;left:50%;bottom:0;width:min(640px,100%);max-height:92dvh;overflow:auto;overscroll-behavior:contain;transform:translate(-50%,105%);background:rgba(28,28,32,.9);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--stroke2);border-bottom:0;border-radius:30px 30px 0 0;padding:8px 22px calc(26px + env(safe-area-inset-bottom));transition:transform .6s var(--ios),visibility .6s;visibility:hidden}
.sheet.on{transform:translate(-50%,0);visibility:visible}
.sheet.dragging{transition:none}
@media(min-width:761px){
  .sheet{bottom:auto;top:50%;border-bottom:1px solid var(--stroke2);border-radius:30px;max-height:88vh;transform:translate(-50%,-46%) scale(.94);opacity:0;transition:transform .55s var(--spring),opacity .25s,visibility .55s;box-shadow:0 40px 120px rgba(0,0,0,.7)}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .grab{display:none}
}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:4px auto 16px;touch-action:none}
.sheet h2{margin:10px 0 2px;font-size:28px;font-weight:800;letter-spacing:-.035em}
.sheet .shp{margin:0;color:var(--text2)}
.sheet textarea{width:100%;resize:none;font-size:20px;font-weight:600;background:none;padding:6px 0;border:0;border-radius:0}
.sheet textarea:focus{background:none}
.sheet.compose textarea{background:var(--fill);border-radius:16px;padding:14px 16px;font-size:18px;font-weight:600;line-height:1.3;min-height:64px}
.sheet.compose .chips{gap:8px}
.sheet.compose .chip{height:40px;padding:0 16px;font-size:14px}
.sheet.compose .chip-date{height:40px}
.cmp{min-height:268px;display:flex;flex-direction:column}
.cmp .row.end{margin-top:auto}
.cmp-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.cmp-back{width:30px;height:30px;border-radius:50%;background:var(--fill);font-size:20px;line-height:1;display:grid;place-items:center}
.cmp-task{flex:1;min-width:0;font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-dots{display:flex;gap:5px}
.cmp-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .3s,transform .3s}
.cmp-dots i.on{background:#fff;transform:scale(1.25)}
.cmp-hint{font-size:13px;color:var(--text3);margin-top:12px}
@keyframes stepIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes stepBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.step-in{animation:stepIn .32s var(--ios)}
.step-back{animation:stepBack .32s var(--ios)}
.qline{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:18px 0 10px}
.sheet .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:12px;font-weight:600;color:var(--text2)}
.sheet .field input,.sheet .field textarea{font-size:16px;font-weight:400;color:var(--text);background:var(--fill);padding:11px 13px;border-radius:12px}
.sheet .field textarea{min-height:80px;resize:vertical}
.sart{margin:-8px -22px 16px;border-radius:30px 30px 0 0}
.sart .art{min-height:210px;padding:26px 24px 22px;border-radius:30px 30px 0 0}
.sart .close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);display:grid;place-items:center;font-size:18px}
.srings{display:flex;align-items:center;gap:10px}
.sec-l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:20px 0 6px}
.ex{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-radius:14px;transition:background .3s}
.ex+.ex{box-shadow:0 -1px 0 var(--sep)}
.ex .eb{flex:1;min-width:0;cursor:pointer}
.ex .en{font-size:15px;font-weight:600;transition:color .3s}
.ex .er{font-size:13px;color:var(--text2)}
.ex .ed{font-size:13px;color:var(--text2);max-height:0;overflow:hidden;opacity:0;transition:max-height .45s var(--ios),opacity .3s,margin .3s}
.ex.open .ed{max-height:120px;opacity:1;margin-top:6px}
.ex.done .en{color:var(--text3);text-decoration:line-through}
.sets{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:180px}
.set{width:36px;height:36px;border-radius:50%;background:var(--fill);font-size:13px;font-weight:700;color:var(--text2);transition:background .25s,color .25s,transform .45s var(--spring),box-shadow .3s}
@media(pointer:coarse){.set{width:42px;height:42px;font-size:14px}.sets{gap:8px;max-width:200px}}
.set:hover:not(:disabled){background:rgba(118,118,128,.36)}
.set.on{background:var(--c);color:#000;box-shadow:0 0 16px -2px var(--c)}
.set:disabled{opacity:.5}
.note{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);font-size:14px;color:var(--text2);margin-top:14px}

/* spotlight */
.spot{position:fixed;z-index:76;left:50%;top:12vh;width:min(660px,calc(100% - 24px));transform:translateX(-50%) translateY(-10px) scale(.96);opacity:0;visibility:hidden;transition:transform .45s var(--spring),opacity .2s,visibility .45s;background:rgba(32,32,38,.86);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--stroke2);border-radius:24px;box-shadow:0 40px 120px rgba(0,0,0,.7);overflow:hidden}
.spot.on{transform:translateX(-50%) scale(1);opacity:1;visibility:visible}
.spot-in{display:flex;align-items:center;gap:14px;padding:18px 22px}
.spot-in svg{width:24px;height:24px;color:var(--text2);flex:none}
.spot-in input{flex:1;background:none;border:0;padding:0;font-size:22px;font-weight:500;letter-spacing:-.02em}
.spot-in input:focus{background:none}
.spot-prev{border-top:1px solid var(--sep);padding:14px 22px;display:flex;align-items:center;gap:14px;min-height:74px}
.spot-prev .pi{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 85%,#fff)}
.spot-prev .pi svg{width:22px;height:22px}
.spot-prev b{display:block;font-size:16px}
.spot-prev .chips{margin-top:6px;gap:6px}
.spot-prev .pill{font-size:11.5px}
.spot-prev .ret{margin-left:auto;font-size:12px;color:var(--text3);white-space:nowrap}
.spot-ex{border-top:1px solid var(--sep);padding:12px 22px 16px}
.spot-ex .chips{gap:6px}
.spot-ex .chip{height:30px;font-size:12.5px;font-weight:500;color:var(--text2)}
.spot-flash{animation:flash .6s ease}
@keyframes flash{0%{background:color-mix(in srgb,var(--green) 25%,transparent)}100%{background:transparent}}

/* dynamic island */
#island{position:fixed;z-index:90;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) scale(.5);opacity:0;visibility:hidden;min-height:38px;max-width:calc(100vw - 24px);padding:8px 16px;border-radius:24px;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;white-space:nowrap;transition:transform .55s var(--spring),opacity .25s,visibility .55s,padding .4s var(--spring);cursor:pointer}
#island.on{transform:translateX(-50%) scale(1);opacity:1;visibility:visible}
#island.big{padding:12px 20px;border-radius:28px;font-size:15px}
#island .il-t{overflow:hidden;text-overflow:ellipsis}
#island b{font-variant-numeric:tabular-nums}
#island .il-ic{display:grid;place-items:center}
#island .il-ic svg{width:18px;height:18px}
#island .il-a{height:28px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.14);font-size:13px;font-weight:700}
#island .il-a:hover{background:rgba(255,255,255,.24)}
@media(min-width:761px){#island{top:76px}}
.confetti{position:fixed;z-index:95;width:9px;height:9px;border-radius:2px;pointer-events:none}

@media(pointer:coarse){input,select,textarea,.qadd input,.add input,.sheet .field input{font-size:16px!important}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ===== v3: player stage, disc, orbs, notes ===== */
/* a soft diagonal beam of light behind everything, blue into rose */
.ambient .beam{position:absolute;left:-30%;top:-10%;width:160%;height:46%;transform:rotate(-24deg);background:linear-gradient(90deg,transparent 0,rgba(90,160,255,.10) 30%,rgba(255,140,190,.08) 60%,transparent 100%);filter:blur(40px);animation:beam 18s ease-in-out infinite alternate}
@keyframes beam{0%{transform:rotate(-24deg) translate3d(-4%,0,0)}100%{transform:rotate(-20deg) translate3d(5%,6%,0)}}

.today-grid .rail>section{margin:0}
.today-grid .rail{display:flex;flex-direction:column;gap:16px}
@media(max-width:1100px){.today-grid .rail{grid-column:1/-1;flex-direction:row}.today-grid .rail>section{flex:1}}
@media(max-width:760px){
  #v-today .today-grid{display:flex;flex-direction:column}
  .today-grid .rail{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
  .today-grid .rail>section{flex:0 0 86%;scroll-snap-align:center}
}

/* needs a decision: the title gets its own line, buttons sit under it */
.decs{display:flex;flex-direction:column;gap:10px}
.dec{padding:12px;border-radius:18px;background:rgba(255,255,255,.035);box-shadow:inset 3px 0 0 var(--c)}
.dec-h{display:flex;gap:12px;align-items:flex-start;min-width:0}
.dec-i{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 85%,#fff)}
.dec-i svg{width:19px;height:19px}
.dec-t{flex:1;min-width:0}
.dec-t b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-size:15px;font-weight:600;line-height:1.3}
.dec-t span{display:block;margin-top:2px;font-size:12.5px;color:var(--text2)}
.dec-b{display:flex;gap:8px;margin-top:10px;padding-left:48px}
.dec-b .btn{flex:1;justify-content:center}
@media(max-width:420px){.dec-b{padding-left:0}}
.nitem .nb b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* the work disc */
.disc-card .ch{margin-bottom:6px}
.disc{position:relative;width:min(210px,62vw);aspect-ratio:1;margin:6px auto 4px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.10),rgba(255,255,255,.02) 60%,rgba(0,0,0,.3) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 -18px 40px rgba(0,0,0,.4),0 24px 50px -24px rgba(0,0,0,.9)}
.disc[role=button]{cursor:pointer;transition:transform .4s var(--spring)}
.disc[role=button]:active{transform:scale(.95)}
.disc>svg{position:absolute;inset:0;width:100%;height:100%;fill:none}
.disc.idle .dk-p{opacity:0}
.disc .dk-t{stroke:rgba(255,255,255,.08);stroke-width:5}
.disc .dk-p{stroke:var(--blue);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--blue));transition:stroke-dashoffset 1s linear}
.disc.done .dk-p{stroke:var(--teal);filter:drop-shadow(0 0 6px var(--teal))}
.disc.paused .dk-p{stroke:var(--orange);filter:drop-shadow(0 0 6px var(--orange))}
.dk-grooves{position:absolute;inset:14%;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.035) 0 1px,transparent 1px 5px),conic-gradient(from 0deg,transparent 0 20%,rgba(255,255,255,.10) 25%,transparent 30% 70%,rgba(255,255,255,.07) 75%,transparent 80%)}
.disc.spin .dk-grooves{animation:spin 6s linear infinite}
.disc.idle .dk-grooves{animation:spin 30s linear infinite}
.dk-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;width:62%;aspect-ratio:1;justify-content:center;border-radius:50%;background:radial-gradient(circle at 50% 35%,#1d2233,#0b0d15);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.5)}
.dk-in b{font-size:28px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.dk-in b small{font-size:14px;color:var(--text2);margin-left:2px}
.dk-in span{font-size:11px;color:var(--text2);margin-top:5px;padding:0 6px}
.disc.spin .dk-in b{font-size:24px}
.dk-play{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#000;box-shadow:0 0 0 8px rgba(255,255,255,.06),0 0 30px rgba(10,132,255,.5)}
.dk-play svg{width:22px;height:22px;margin-left:3px}
.dk-in .dk-lbl{font-size:13px;font-weight:700;letter-spacing:.02em;margin-top:9px}
.disc-row{margin-top:14px;justify-content:center}

/* one big number in a ring of dots */
.orb{position:relative;width:132px;aspect-ratio:1;display:grid;place-items:center;flex:none}
.orb svg{position:absolute;inset:0;width:100%;height:100%;fill:none;overflow:visible}
.orb-d1,.orb-d2{stroke:var(--c);stroke-linecap:round;transform-origin:60px 60px}
.orb-d1{stroke-width:1.6;stroke-dasharray:.1 5.9;opacity:.55;animation:spin 40s linear infinite}
.orb-d2{stroke-width:1.1;stroke-dasharray:.1 3.9;opacity:.35;animation:spin 26s linear infinite reverse}
.orb-t{stroke:rgba(255,255,255,.08);stroke-width:4}
.orb-p{stroke:var(--c);stroke-width:4;filter:drop-shadow(0 0 7px var(--c))}
.orb-v{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1}
.orb-v b{font-size:36px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.orb-v small{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#fff);margin-top:4px}
.hero.has-orb{align-items:center;justify-content:flex-start;flex-wrap:nowrap}
.hero.has-orb .hero-main{flex:1;min-width:0}
@media(max-width:760px){.orb{width:104px}.orb-v b{font-size:28px}.hero.has-orb{flex-wrap:wrap;gap:14px}.hero.has-orb .hero-r{width:100%}}

/* sessions per week */
.wbars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;align-items:end;margin-top:6px}
.wb{display:flex;flex-direction:column;align-items:center;gap:6px;animation:cardIn .5s var(--ios) both;animation-delay:calc(var(--i)*45ms)}
.wb-n{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text2)}
.wb-t{position:relative;width:100%;max-width:34px;height:112px;border-radius:10px;background:rgba(255,255,255,.06);overflow:hidden}
.wb-t i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--h)*100%);border-radius:10px;background:linear-gradient(180deg,#ffc46b,var(--orange));transform-origin:bottom;animation:barGrow .9s var(--ease) both;animation-delay:calc(var(--i)*60ms + .15s)}
@keyframes barGrow{from{transform:scaleY(0)}}
.wb.full .wb-t i{background:linear-gradient(180deg,#fff3a3,var(--yellow));box-shadow:0 0 16px -2px var(--yellow)}
.wb.full .wb-n{color:var(--yellow)}
.wb.cur .wb-t{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.wb.cur .wb-d{color:var(--text)}
.wb.pre{opacity:.35}
.wb-d{font-size:10.5px;font-weight:600;color:var(--text3);white-space:nowrap}
.wb-cap{margin:14px 0 0}
@media(max-width:420px){.wbars{gap:5px}.wb-d{font-size:9.5px}}

/* notes */
.cap{margin-bottom:16px}
.cap textarea{width:100%;resize:none;min-height:84px;font-size:16px;line-height:1.45;background:rgba(255,255,255,.04);border-radius:16px;padding:14px 16px}
.cap-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.cap-row .chips{flex:1}
.note-q{width:100%;margin:0 0 6px;border-radius:14px;padding:11px 14px}
.notes{columns:3 250px;column-gap:14px}
.note{position:relative;display:block;width:100%;break-inside:avoid;margin:0 0 14px;padding:16px 16px 14px;border-radius:22px;text-align:left;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,rgba(255,255,255,.04)),rgba(255,255,255,.03) 55%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);transition:transform .35s var(--spring),box-shadow .25s}
.note::before{content:"";position:absolute;left:16px;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--c);box-shadow:0 0 12px var(--c)}
.note:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.note:active{transform:scale(.98)}
.note b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.note p{margin:6px 0 0;font-size:14px;color:var(--text2);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.nt-f{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--text3)}
.nt-f .cd{width:7px;height:7px;border-radius:50%;background:var(--c)}
.nt-pin{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.note.fx-in{animation:noteIn .6s var(--spring) both}
@keyframes noteIn{from{opacity:0;transform:translateY(-12px) scale(.94)}}
.note-ed{width:100%;min-height:42vh;resize:vertical;font-size:16px;line-height:1.5;border-radius:16px;padding:14px 16px;margin:4px 0 14px}
@media(max-width:760px){.notes{columns:2 150px;column-gap:10px}.note{margin-bottom:10px;padding:14px 13px 12px;border-radius:18px}.note b{font-size:15px}.note p{font-size:13px;-webkit-line-clamp:6}}

/* ===== v4: buddy, halos ===== */
:root{--display:"Unbounded",var(--font);--mint1:#9ff5d6;--mint2:#18c29c}
/* the gradient lives on the fixed .ambient layer: background-attachment:fixed repaints every scroll frame on iOS */
.ambient{background:radial-gradient(120% 80% at 70% -10%,#1a2350 0%,#0a0e22 45%,#05060a 100%)}
.ambient .beam{height:60%;top:-18%;background:linear-gradient(90deg,transparent 0,rgba(80,150,255,.20) 28%,rgba(255,150,200,.16) 58%,transparent 100%);filter:blur(46px)}
.ambient .beam+.beam{top:30%;left:-40%;transform:rotate(-24deg);opacity:.6;animation-duration:24s;animation-direction:alternate-reverse}
.hero h1{font-weight:300;letter-spacing:-.045em}
.hero .kicker{letter-spacing:.14em;font-size:12px}
.card{border-radius:30px;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.03) 60%);border-color:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.btn{border-radius:999px}
.timer,.big,.orb-v b,.dk-in b,.lvl b{font-family:var(--display);font-weight:600;letter-spacing:-.04em}
.nitem,.jrow{border-radius:20px}
.top .nav{display:none}

.tabbar{display:none!important}
.fab,.fab[class]{display:none!important}
.lvl{display:none}

/* ---- Dex: the fallback buddy and his speech bubble ---- */
#buddySlot,.bd{position:absolute;inset:0}
.bd canvas{display:block;width:100%!important;height:100%!important;touch-action:pan-y;cursor:pointer}
#buddySlot.no3d::after{content:"Your buddy needs WebGL";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.5);font-size:13px}
.stg-top{position:absolute;z-index:3;left:18px;right:18px;top:18px;display:flex;align-items:center;gap:12px;pointer-events:none}
.stg-top>*{pointer-events:auto}
.stg-sq{width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;align-content:center;background:#fff;color:#141828;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);font-family:var(--display);line-height:.95;transition:transform .35s var(--spring)}
.stg-sq small{font-size:8.5px;font-weight:700;letter-spacing:.14em;opacity:.55}
.stg-sq b{font-size:19px;font-weight:700}
.stg-sq.ghost{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.stg-sq.ghost svg{width:22px;height:22px}
.stg-sq:active{transform:scale(.92)}
.stg-hi{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.stg-hi span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.stg-hi b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.bd-say{position:absolute;left:0;top:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .2s}
.bd-say span{position:absolute;left:0;bottom:10px;transform:translateX(-50%) scale(.7);transform-origin:50% 100%;display:block;max-width:220px;width:max-content;padding:10px 14px;border-radius:18px;background:#fff;color:#141828;font-size:13.5px;font-weight:600;line-height:1.3;text-align:center;box-shadow:0 14px 30px -12px rgba(0,0,0,.6);transition:transform .45s var(--spring)}
.bd-say span::after{content:"";position:absolute;left:50%;bottom:-6px;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.bd-say.on{opacity:1}
.bd-say.on span{transform:translateX(-50%) scale(1)}
.bd-z{position:absolute;left:0;top:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .6s}
.bd-z.on{opacity:1}
.bd-z i{position:absolute;font-style:normal;font-family:var(--display);font-weight:700;color:rgba(200,220,255,.85);animation:zz 3s ease-in infinite}
.bd-z i:nth-child(1){font-size:12px}.bd-z i:nth-child(2){font-size:16px;animation-delay:1s}.bd-z i:nth-child(3){font-size:22px;animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-60px)}}
.today-grid .rail{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.today-grid .rail>section{margin:0}
@media(max-width:1100px){.today-grid .rail{grid-template-columns:1fr 1fr}.today-grid .next-card{grid-column:1/-1}}
@media(max-width:760px){.today-grid .rail{display:flex!important;flex-direction:column}}

/* ---- halo: a big number in a ring of particles ---- */
.halo{position:relative;width:170px;aspect-ratio:1;display:grid;place-items:center;flex:none}
.halo canvas{position:absolute;inset:-12%;width:124%;height:124%}
.halo .orb-v b{font-size:42px}
.halo .orb-v small{margin-top:6px}
@media(max-width:760px){.halo{width:128px}.halo .orb-v b{font-size:32px}}

/* ---- every tab: a studio stage up top ---- */
.hero.hst{display:flex;flex-direction:column;align-items:stretch;gap:18px;margin:22px 0 18px;padding:28px;border-radius:36px;position:relative;overflow:hidden;background:radial-gradient(90% 90% at 70% 20%,#56618a 0%,#343c5c 40%,#191e33 85%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 40px 80px -40px rgba(0,0,0,.9)}
.hero.hst::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 25%,rgba(140,180,255,.12) 42%,rgba(255,160,200,.09) 55%,transparent 70%)}
.hero.hst>*{position:relative;z-index:1}
.hst-main{display:flex;align-items:center;gap:26px}
.hst-lead{flex:none}
.hst .hero-main{flex:1;min-width:0}
.hst h1{font-size:clamp(34px,5vw,56px);color:#fff}
.hst .kicker{color:color-mix(in srgb,var(--glow) 55%,#fff)}
.hst p{color:rgba(255,255,255,.7)}
.hst-chips{display:flex;gap:12px;flex-wrap:wrap}
.hchip{flex:1;min-width:120px;max-width:220px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 16px;border-radius:22px;background:#fff;color:#141828;text-align:left;box-shadow:0 18px 36px -18px rgba(0,0,0,.75);transition:transform .35s var(--spring)}
button.hchip:active{transform:scale(.95)}

.hchip b small{font-size:13px;opacity:.45;margin-left:2px}
.hchip span{font-size:12px;font-weight:600;color:rgba(20,24,40,.55)}
.hst .hero-r{justify-content:flex-start}
.hst .hero-r .btn{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hst .hero-r .btn.fill{background:linear-gradient(90deg,var(--mint1),var(--mint2));color:#062a20;box-shadow:0 14px 28px -14px rgba(24,194,156,.8)}

.hst .wnav{margin-left:auto}
@media(max-width:760px){
  .hero.hst{margin:12px -6px 16px;padding:20px 18px;border-radius:30px;gap:14px}

/* light panels: the list-style content, like the player card */

  --text:#141828;--text2:rgba(20,24,40,.6);--text3:rgba(20,24,40,.4);--sep:rgba(20,24,40,.07);--fill:rgba(20,24,40,.07);--glass:rgba(20,24,40,.04);--stroke:rgba(20,24,40,.08)}

.lightp .jrow:hover{background:#fff}

/* ===== v5: modules, a calmer stage ===== */
/* Today's stage: just the skier, your name and level */
.stage2{position:relative;height:clamp(420px,58vh,560px);margin:18px 0 14px;border-radius:34px;overflow:hidden;background:radial-gradient(80% 70% at 50% 36%,#5d6890 0%,#353d5f 40%,#1b2037 80%,#121626 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 40px 80px -40px rgba(0,0,0,.9)}
.stage2::before{content:"";position:absolute;left:50%;bottom:7%;width:74%;height:20%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(235,242,255,.22),transparent);pointer-events:none}
.stage2::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 28%,rgba(140,180,255,.10) 44%,rgba(255,200,120,.08) 56%,transparent 72%)}
.stage2 .stg-top{position:absolute;z-index:3;left:16px;right:16px;top:16px;display:flex;align-items:center;gap:12px}

.stg-xp em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.stg-date{position:absolute;z-index:3;left:0;right:0;bottom:14px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45);pointer-events:none}
@media(max-width:760px){.stage2{margin:10px -6px 12px;height:min(470px,60vh);border-radius:30px}}

/* ---- modules ---- */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 16px;grid-auto-flow:row dense}
@media(min-width:900px){.mods{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.mod{position:relative;min-width:0;border-radius:26px;scroll-margin-top:84px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.028) 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.075),0 22px 44px -30px rgba(0,0,0,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .4s,box-shadow .4s;animation:cardIn .55s var(--ios) both;animation-delay:calc(var(--i,0)*38ms)}
.mod.open,.mod.wide{grid-column:1/-1}
.mod-h{position:relative;width:100%;min-height:136px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto auto;align-items:start;padding:14px 14px 13px;text-align:left;color:inherit;border-radius:26px}
.mod-h:active{transform:scale(.985)}
.mod-ic{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:color-mix(in srgb,var(--c) 85%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 28%,transparent)}
.mod-ic svg{width:19px;height:19px}
.mod-dot{justify-self:end;width:7px;height:7px;margin-top:4px;border-radius:50%;background:rgba(255,255,255,.18)}
.mod.live .mod-dot{background:var(--c);box-shadow:0 0 10px var(--c)}
.mod.alert .mod-dot{background:var(--red);box-shadow:0 0 10px var(--red);animation:pulseDot 1.6s infinite}
.mod-l{grid-column:1/-1;align-self:end;margin-top:14px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text2)}
.mod-v{grid-column:1/-1;font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:-.04em;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:44px}
.mod-v small{font-size:13px;opacity:.5;font-weight:600;letter-spacing:0;margin-left:2px}
.mod-s{grid-column:1/-1;font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:44px}
.mod-x{display:none}
.mod-q{position:absolute;right:12px;bottom:12px;z-index:2;transition:opacity .25s,transform .35s var(--spring)}
.qbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--q,#fff);color:#141828;box-shadow:0 10px 22px -10px rgba(0,0,0,.8);transition:transform .35s var(--spring)}
.qbtn[style*="--q"]{color:#fff}
.qbtn:active{transform:scale(.88)}
.qbtn svg{width:18px;height:18px}
.mod-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ios)}
.mod-in{overflow:hidden;min-height:0;opacity:0;transition:opacity .3s}
.mod.open .mod-b{grid-template-rows:1fr}
.mod.open .mod-in{opacity:1;transition-delay:.12s}
.mod-in>.ch:first-child,.mod-in>.ch:first-child+.sub[style]{display:none}
/* open: the tile turns into a light card with a dark title bar, like a settings module */
.mod.open{background:#eef1f7;color:#141828;box-shadow:0 34px 70px -34px rgba(0,0,0,.95);backdrop-filter:none;-webkit-backdrop-filter:none;
  --text:#141828;--text2:rgba(20,24,40,.62);--text3:rgba(20,24,40,.42);--sep:rgba(20,24,40,.08);--fill:rgba(20,24,40,.07);--glass:rgba(20,24,40,.04);--glass2:#fff;--stroke:rgba(20,24,40,.1)}
.mod.open .mod-h{display:flex;align-items:center;gap:10px;min-height:0;margin:8px;width:calc(100% - 16px);padding:9px 10px 9px 9px;border-radius:19px;background:#141828;color:#fff}
.mod.open .mod-ic{width:32px;height:32px;border-radius:11px}
.mod.open .mod-dot,.mod.open .mod-s{display:none}
.mod.open .mod-l{order:1;margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em;text-transform:none;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod.open .mod-v{order:2;font-size:14px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;flex:none}
.mod.open .mod-v small{font-size:11px}
.mod.open .mod-x{order:3;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;flex:none;position:relative}
.mod.open .mod-x::before,.mod.open .mod-x::after{content:"";position:absolute;width:12px;height:2px;border-radius:2px;background:#141828;transform:rotate(45deg)}
.mod.open .mod-x::after{transform:rotate(-45deg)}
.mod.open .mod-q{opacity:0;pointer-events:none;transform:scale(.6)}
.mod.open .mod-in{padding:6px 16px 18px}
/* light surfaces for things that live inside an open module (and the light panels) */
:is(.mod.open,.lightp) .task{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 0 0 1px rgba(20,24,40,.07)}
:is(.mod.open,.lightp) .tasks{gap:7px}
:is(.mod.open,.lightp) .task+.task{box-shadow:0 0 0 1px rgba(20,24,40,.07)}
:is(.mod.open,.lightp) .task.done .tt{text-decoration-color:rgba(20,24,40,.3)}
:is(.mod.open,.lightp) .qadd{background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgba(20,24,40,.07);margin-top:10px}
:is(.mod.open,.lightp) .qadd input{color:#141828;background:none;box-shadow:none}
:is(.mod.open,.lightp) input,:is(.mod.open,.lightp) select,:is(.mod.open,.lightp) textarea{color-scheme:light;background:#fff;color:#141828;box-shadow:0 0 0 1px rgba(20,24,40,.1)}
:is(.mod.open,.lightp) .btn{background:#fff;border-color:rgba(20,24,40,.1);color:#141828}
:is(.mod.open,.lightp) .btn.white{background:linear-gradient(90deg,var(--mint1),var(--mint2));color:#062a20;border-color:transparent}
:is(.mod.open,.lightp) .btn.tint{background:color-mix(in srgb,var(--c,var(--blue)) 16%,#fff);color:color-mix(in srgb,var(--c,var(--blue)) 75%,#000);border-color:transparent}
:is(.mod.open,.lightp) .btn.fill{background:var(--c,var(--blue));color:#fff}
:is(.mod.open,.lightp) .chip{background:rgba(20,24,40,.07);color:#141828}
:is(.mod.open,.lightp) .chip.on{background:var(--c);color:var(--on,#fff)}
:is(.mod.open,.lightp) .nitem,:is(.mod.open,.lightp) .pw,:is(.mod.open,.lightp) .bm,:is(.mod.open,.lightp) .dec,:is(.mod.open,.lightp) .shake{background:#fff;box-shadow:0 0 0 1px rgba(20,24,40,.07)}
:is(.mod.open,.lightp) .shake .sk-box{border-color:rgba(20,24,40,.25)}
:is(.mod.open,.lightp) .shake.on{background:color-mix(in srgb,var(--green) 14%,#fff)}
:is(.mod.open,.lightp) .banner{background:rgba(255,69,58,.1);color:#b3261e}
:is(.mod.open,.lightp) .submitbox{background:color-mix(in srgb,var(--teal) 14%,#fff)}
:is(.mod.open,.lightp) .sb-head span{color:#0b6f8a}
:is(.mod.open,.lightp) .sb-days span{background:#fff}
:is(.mod.open,.lightp) .pbar{background:rgba(20,24,40,.09)}
:is(.mod.open,.lightp) .wb-t{background:rgba(20,24,40,.07)}
:is(.mod.open,.lightp) .dk-in{color:#fff}
:is(.mod.open,.lightp) .disc{background:radial-gradient(circle at 50% 42%,#2a3048,#141828 70%)}
:is(.mod.open,.lightp) .ni{color:color-mix(in srgb,var(--c) 70%,#000)}
:is(.mod.open,.lightp) .dec-i{color:color-mix(in srgb,var(--c) 70%,#000)}
.mod-art .art{border-radius:22px;min-height:210px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--sep);font-size:14px}
.kv span{color:var(--text2)}
.kv b{font-weight:600;text-align:right}
.mini-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.mini-list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#fff;font-size:14px;box-shadow:0 0 0 1px rgba(20,24,40,.07)}
.mini-list li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
/* shift rows: a one-line summary that opens to edit */
.srows{display:flex;flex-direction:column;gap:7px}
.srow2{border-radius:18px;background:#fff;box-shadow:0 0 0 1px rgba(20,24,40,.07);overflow:hidden}
.srow2.today{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--red) 55%,transparent)}
.sr-h{width:100%;display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 14px;text-align:left;color:inherit}
.sr-d b{display:block;font-size:15px;font-weight:700}
.sr-d span{font-size:11px;color:var(--text3)}
.srow2.today .sr-d b{color:var(--red)}
.sr-t{font-size:13.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-h .sh{font-size:20px}
.sr-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ios)}
.sr-in{overflow:hidden;min-height:0;padding:0 14px}
.srow2.open .sr-b{grid-template-rows:1fr}
.srow2.open .sr-in{padding:2px 14px 14px}
.srow2 .sin{margin-bottom:10px}

.sgrp{border-radius:18px;background:rgba(255,255,255,.04);margin-bottom:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sgrp>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;font-weight:700;font-size:15px}
.sgrp>summary::-webkit-details-marker{display:none}
.sgrp>summary span{font-weight:500;font-size:12.5px;color:var(--text3)}
.sgrp>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--text3);border-bottom:2px solid var(--text3);transform:rotate(45deg);transition:transform .3s;margin-left:6px}

.sgrp>.sg-in{padding:0 16px 16px}

.mod.wide:not(.open) .mod-h{display:flex;align-items:center;gap:12px;min-height:0;padding:12px 14px}
.mod.wide:not(.open) .mod-l{margin:0;flex:1;font-size:15px;font-weight:700;letter-spacing:-.01em;text-transform:none;color:var(--text)}
.mod.wide:not(.open) .mod-v{padding:0;font-size:20px}
.mod.wide:not(.open) .mod-s,.mod.wide:not(.open) .mod-dot{display:none}

/* ---- attributes around the skier ---- */
.attrs{position:absolute;z-index:3;top:86px;display:flex;flex-direction:column;gap:10px;pointer-events:none}

// What the buddy knows about your day: its mood, its lights, and what it can tell you.
window.buddyContext = function () {
  const d = today(), list = tasksOn(d), done = list.filter(t => isDone(t, d)).length, left = list.length - done;
  const w = wo(d), hr = new Date().getHours(), name = S.settings.name || 'there', wk = curWeek(), ag = +S.settings.appGoal || 0, apps = appsIn(wk);
  const cut = s => s.length > 44 ? s.slice(0, 42).trim() + '…' : s;
  const lines = [], slip = slipped(), p = periodFor(d), due = daysBetween(d, submitDay(p)), sk = shakesToday();
  if (slip.length) lines.push(`Don’t forget: ${esc(cut(slip[0].title))}`);
  if (S.clock) lines.push(`On the clock for ${fmtDur(clockElapsed()).replace(/:\d\d$/, '')}.`);
  if (left) { const nx = list.find(t => !isDone(t, d)); lines.push(`${left} left today. Next: ${esc(cut(nx.title))}`); }
  else lines.push(list.length ? 'Your list is clear. Nice.' : 'Nothing on the list yet. Add something?');
  lines.push(w.s === 'REST' ? 'Rest day. Walk, stretch, eat well.' : w.done ? `${esc(sessName(w.s))} is done. Recover well.` : `${esc(sessName(w.s))} is on today.`);
  if (due >= 0 && due <= 2) lines.push(due === 0 ? 'Send your hours to Len today.' : `Hours go to Len in ${due} day${due === 1 ? '' : 's'}.`);
  if (ag && apps < ag) lines.push(`${ag - apps} more application${ag - apps === 1 ? '' : 's'} to hit ${ag} this week.`);
  if (!sk.p && hr >= 10) lines.push('Protein shake yet?');
  const greet = hr < 5 ? `Up late, ${esc(name)}?` : hr < 12 ? `Morning, ${esc(name)}!` : hr < 17 ? `Hey ${esc(name)}!` : `Evening, ${esc(name)}!`;
  return {
    mode: S.clock && !S.clock.breakTs ? 'work' : (hr >= 23 || hr < 6) ? 'sleep' : 'idle',
    training: w.s !== 'REST' && w.s !== 'HIIT' && !w.done, sessionDone: !!w.done, sessionLive: !!(w.prog && w.prog.p > 0 && !w.done), allDone: list.length > 0 && !left, late: hr >= 22,
    leds: [S.clock || shiftHours(S.shifts[d]) ? 1 : 0, w.done ? 1 : w.prog ? w.prog.p : 0, ag ? apps / ag : 0],
    lines, greet: `${greet} ${lines[0] || ''}`, dex: S.settings.dex,
  };
};

function spark(v) {
  if (v.length < 2) return '<svg></svg>';
  const s = v.slice(-10), mx = Math.max(...s), mn = Math.min(...s), rg = mx - mn || 1;
  const pts = s.map((x, i) => `${(i / (s.length - 1) * 100).toFixed(1)},${(26 - (x - mn) / rg * 22).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 28" preserveAspectRatio="none"><polyline class="spark-line" points="${pts}" fill="none" stroke="#ff9f0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

    const r = parseQuick(v);
